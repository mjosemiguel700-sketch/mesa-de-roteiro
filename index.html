/* ========== layout visual: frames de mangá para redimensionar e desenhar ========== */
/* Cada página pode ter um layout visual (pg.visual), salvo junto com o capítulo:
   pg.visual = { ativo:"A", dados:{ A:{ r:[razões das divisões], s:{ idxQuadro:[traços] } } } }
   Os desenhos de cada layout ficam guardados separadamente (trocar de layout não apaga nada). */
var vF=function(){return {leaf:true};};
var vS=function(dir,ratio,a,b){return {dir:dir,ratio:ratio,a:a,b:b};};
/* dir "v" = divide lado a lado; dir "h" = divide em cima/embaixo. Para criar outro layout, copie uma linha. */
var LAYOUTS_VISUAIS={
  A:{nome:"A · 6 quadros",build:function(){
    return vS("h",0.54,
      vS("v",0.6,vS("h",0.5,vF(),vF()),vF()),
      vS("v",0.4,vF(),vS("h",0.5,vF(),vF())));}},
  B:{nome:"B · 6 quadros",build:function(){
    return vS("h",0.55,
      vS("h",0.5,vS("v",0.27,vF(),vF()),vS("v",0.7,vF(),vF())),
      vS("v",0.3,vF(),vF()));}},
  C:{nome:"C · 3 tiras",build:function(){return vS("h",0.34,vF(),vS("h",0.5,vF(),vF()));}},
  D:{nome:"D · grade 2×2",build:function(){return vS("h",0.5,vS("v",0.5,vF(),vF()),vS("v",0.5,vF(),vF()));}},
  E:{nome:"E · 1 grande + 2",build:function(){return vS("h",0.6,vF(),vS("v",0.5,vF(),vF()));}},
  F:{nome:"F · página cheia",build:function(){return vF();}}
};
var LAYOUT_PADRAO="A";
var vFerr={t:"p",c:"#111111",w:3};   /* ferramenta atual: lápis/borracha, cor, espessura */
var visAberto={}, visHist={};

function vDpr(){ return window.devicePixelRatio||1; }

function vDesenharTraco(ctx,s,cw,ch){
  var pts=s.p, i; if(!pts||!pts.length) return;
  ctx.save();
  ctx.globalCompositeOperation=s.t==="e"?"destination-out":"source-over";
  ctx.strokeStyle=s.c; ctx.fillStyle=s.c;
  ctx.lineWidth=s.w*vDpr();
  ctx.lineCap="round"; ctx.lineJoin="round";
  if(pts.length===1){
    ctx.beginPath(); ctx.arc(pts[0][0]*cw,pts[0][1]*ch,ctx.lineWidth/2,0,Math.PI*2); ctx.fill();
  }else{
    ctx.beginPath(); ctx.moveTo(pts[0][0]*cw,pts[0][1]*ch);
    for(i=1;i<pts.length;i++) ctx.lineTo(pts[i][0]*cw,pts[i][1]*ch);
    ctx.stroke();
  }
  ctx.restore();
}

/* mantém lápis/borracha, cor e espessura iguais em todas as páginas abertas */
function vSincronizarBarras(){
  var i, a=tela.querySelectorAll('[data-v="lapis"]'), b=tela.querySelectorAll('[data-v="borracha"]'),
      c=tela.querySelectorAll('[data-v="cor"]'), w=tela.querySelectorAll('[data-v="tam"]');
  for(i=0;i<a.length;i++) a[i].classList.toggle("forte",vFerr.t==="p");
  for(i=0;i<b.length;i++) b[i].classList.toggle("forte",vFerr.t==="e");
  for(i=0;i<c.length;i++) c[i].value=vFerr.c;
  for(i=0;i<w.length;i++) w[i].value=vFerr.w;
}

function montarVisuais(){
  if(!doc) return;
  var hosts=tela.querySelectorAll("[data-vis-pg]"), i, k;
  for(i=0;i<hosts.length;i++){
    k=acharPagina(hosts[i].getAttribute("data-vis-pg"));
    if(k>-1) montarVisual(hosts[i].querySelector("[data-vis-host]"),doc.paginas[k],k);
  }
}

function montarVisual(host,pg,ipg){
  if(!host) return;
  var v=pg.visual||{ativo:LAYOUT_PADRAO,dados:{}};   /* só vira parte do capítulo quando o usuário mexe */
  if(!v.dados) v.dados={};
  if(!LAYOUTS_VISUAIS[v.ativo]) v.ativo=LAYOUT_PADRAO;
  var cur=null, obs=[];
  function garantir(){ if(!pg.visual) pg.visual=v; }

  var opcoes=Object.keys(LAYOUTS_VISUAIS).map(function(k){
    return '<option value="'+k+'">'+esc(LAYOUTS_VISUAIS[k].nome)+'</option>';
  }).join("");
  host.innerHTML=
    '<div class="vis-barra">'+
      '<select data-v="layout" aria-label="Layout da página">'+opcoes+'</select>'+
      '<button type="button" class="bt mini" data-v="lapis">Lápis</button>'+
      '<button type="button" class="bt mini" data-v="borracha">Borracha</button>'+
      '<input type="color" data-v="cor" aria-label="Cor do traço" value="'+esc(vFerr.c)+'">'+
      '<input type="range" data-v="tam" min="1" max="30" value="'+vFerr.w+'" aria-label="Espessura do traço">'+
      '<button type="button" class="bt mini" data-v="desfazer">Desfazer</button>'+
      '<button type="button" class="bt mini" data-v="refazer">Refazer</button>'+
      '<button type="button" class="bt mini risco" data-v="limpar">Limpar</button>'+
      '<button type="button" class="bt mini" data-v="png">Baixar PNG</button>'+
    '</div>'+
    '<div class="vis-pagina"></div>'+
    '<p class="vis-dica">Arraste as linhas entre os quadros para mudar o tamanho. Desenhe dentro de cada quadro.</p>';
  var barra=host.querySelector(".vis-barra"), pgEl=host.querySelector(".vis-pagina");
  barra.querySelector('[data-v="layout"]').value=v.ativo;
  barra.querySelector('[data-v="lapis"]').classList.toggle("forte",vFerr.t==="p");
  barra.querySelector('[data-v="borracha"]').classList.toggle("forte",vFerr.t==="e");

  function hist(){ var k=pg.id+":"+v.ativo; return visHist[k]||(visHist[k]={u:[],r:[]}); }

  function redesenhar(leaf){
    var c=leaf.canvas, ctx=leaf.ctx, lst=cur.dados.s[leaf.idx]||[], i;
    ctx.clearRect(0,0,c.width,c.height);
    for(i=0;i<lst.length;i++) vDesenharTraco(ctx,lst[i],c.width,c.height);
  }
  function dimensionar(leaf){
    if(!cur||cur.leaves.indexOf(leaf)<0) return;
    var c=leaf.canvas, r=c.getBoundingClientRect();
    if(!r.width||!r.height) return;        /* seção fechada: ajusta quando abrir */
    c.width=Math.round(r.width*vDpr()); c.height=Math.round(r.height*vDpr());
    redesenhar(leaf);
  }

  function posicionar(node,x,y,w,h){       /* x,y,w,h em % da página */
    node.rect={x:x,y:y,w:w,h:h};
    if(node.leaf){
      var st=node.cell.style; st.left=x+"%"; st.top=y+"%"; st.width=w+"%"; st.height=h+"%";
      return;
    }
    var g=node.gutter.style;
    if(node.dir==="v"){
      var w1=w*node.ratio;
      posicionar(node.a,x,y,w1,h); posicionar(node.b,x+w1,y,w-w1,h);
      g.left=(x+w1)+"%"; g.top=y+"%"; g.height=h+"%";
    }else{
      var h1=h*node.ratio;
      posicionar(node.a,x,y,w,h1); posicionar(node.b,x,y+h1,w,h-h1);
      g.top=(y+h1)+"%"; g.left=x+"%"; g.width=w+"%";
    }
  }

  function ligarGutter(node){
    var g=node.gutter;
    g.addEventListener("pointerdown",function(e){
      e.preventDefault(); g.setPointerCapture(e.pointerId); g.classList.add("drag");
      var moveu=false;
      function mover(ev){
        var pr=pgEl.getBoundingClientRect(), r=node.rect, ratio;
        if(node.dir==="v") ratio=(ev.clientX-(pr.left+pr.width*r.x/100))/(pr.width*r.w/100);
        else ratio=(ev.clientY-(pr.top+pr.height*r.y/100))/(pr.height*r.h/100);
        node.ratio=Math.min(0.9,Math.max(0.1,ratio));
        moveu=true;
        posicionar(cur.tree,0,0,100,100);
      }
      function soltar(){
        g.classList.remove("drag");
        g.removeEventListener("pointermove",mover);
        g.removeEventListener("pointerup",soltar);
        g.removeEventListener("pointercancel",soltar);
        if(!moveu) return;
        garantir();
        cur.dados.r=cur.splits.map(function(s){ return +s.ratio.toFixed(4); });
        marcarSujo();
      }
      g.addEventListener("pointermove",mover);
      g.addEventListener("pointerup",soltar);
      g.addEventListener("pointercancel",soltar);
    });
  }

  function ligarDesenho(leaf){
    var c=leaf.canvas, tr=null, ult=null;
    function pos(e){
      var r=c.getBoundingClientRect();
      return [+((e.clientX-r.left)/r.width).toFixed(4), +((e.clientY-r.top)/r.height).toFixed(4)];
    }
    c.addEventListener("pointerdown",function(e){
      if(e.button>0) return;
      c.setPointerCapture(e.pointerId);
      var p=pos(e);
      tr={t:vFerr.t,c:vFerr.c,w:vFerr.t==="e"?vFerr.w*3:vFerr.w,p:[p]};
      (cur.dados.s[leaf.idx]||(cur.dados.s[leaf.idx]=[])).push(tr);
      ult=p; redesenhar(leaf);
    });
    c.addEventListener("pointermove",function(e){
      if(!tr) return;
      var p=pos(e);
      if(Math.abs(p[0]-ult[0])+Math.abs(p[1]-ult[1])<0.002) return;   /* ignora pontos quase iguais: poupa espaço */
      tr.p.push(p); ult=p; redesenhar(leaf);
    });
    function fim(){
      if(!tr) return;
      garantir();
      var h=hist(); h.u.push({idx:leaf.idx,s:tr}); h.r.length=0;
      tr=null; marcarSujo();
    }
    c.addEventListener("pointerup",fim);
    c.addEventListener("pointercancel",fim);
  }

  function construir(node){
    if(node.leaf){
      var cell=document.createElement("div"); cell.className="vis-cell";
      var fr=document.createElement("div"); fr.className="vis-frame";
      var cv=document.createElement("canvas");
      var num=document.createElement("span"); num.className="vis-num"; num.textContent=String(node.idx+1);
      fr.appendChild(cv); fr.appendChild(num); cell.appendChild(fr); pgEl.appendChild(cell);
      node.cell=cell; node.canvas=cv; node.ctx=cv.getContext("2d");
      var ro=new ResizeObserver(function(){ dimensionar(node); });
      ro.observe(fr); obs.push(ro);
      ligarDesenho(node);
    }else{
      construir(node.a); construir(node.b);
      var g=document.createElement("div"); g.className="vis-gutter "+node.dir;
      pgEl.appendChild(g); node.gutter=g; ligarGutter(node);
    }
  }

  function carregar(key){
    obs.forEach(function(o){ o.disconnect(); }); obs=[];
    v.ativo=key;
    var dados=v.dados[key]||(v.dados[key]={r:[],s:{}});
    if(!dados.s) dados.s={};
    var tree=LAYOUTS_VISUAIS[key].build(), splits=[], leaves=[];
    (function varrer(n){
      if(n.leaf){ n.idx=leaves.length; leaves.push(n); }
      else{ splits.push(n); varrer(n.a); varrer(n.b); }
    })(tree);
    if(dados.r && dados.r.length===splits.length) splits.forEach(function(s,i){ s.ratio=dados.r[i]; });
    cur={key:key,tree:tree,splits:splits,leaves:leaves,dados:dados};
    pgEl.innerHTML="";
    construir(tree);
    posicionar(tree,0,0,100,100);
  }

  barra.addEventListener("click",function(ev){
    var b=ev.target.closest("button[data-v]"); if(!b) return;
    var a=b.getAttribute("data-v"), h, e, lst, i;
    if(a==="lapis"){ vFerr.t="p"; vSincronizarBarras(); }
    else if(a==="borracha"){ vFerr.t="e"; vSincronizarBarras(); }
    else if(a==="desfazer"){
      h=hist(); e=h.u.pop(); if(!e) return;
      lst=cur.dados.s[e.idx]||[]; i=lst.indexOf(e.s);
      if(i>-1) lst.splice(i,1);
      h.r.push(e); redesenhar(cur.leaves[e.idx]); marcarSujo();
    }
    else if(a==="refazer"){
      h=hist(); e=h.r.pop(); if(!e) return;
      (cur.dados.s[e.idx]||(cur.dados.s[e.idx]=[])).push(e.s);
      h.u.push(e); redesenhar(cur.leaves[e.idx]); marcarSujo();
    }
    else if(a==="limpar"){
      confirmarClique(b,"Confirmar?",function(){
        garantir(); cur.dados.s={}; cur.leaves.forEach(redesenhar);
        var hh=hist(); hh.u.length=0; hh.r.length=0;
        b.removeAttribute("data-armado"); b.textContent="Limpar";
        marcarSujo();
      });
    }
    else if(a==="png"){
      var pr=pgEl.getBoundingClientRect(); if(!pr.width) return;
      var k=2000/pr.width, out=document.createElement("canvas");
      out.width=2000; out.height=Math.round(pr.height*k);
      var cx=out.getContext("2d"); cx.fillStyle="#fff"; cx.fillRect(0,0,out.width,out.height);
      var bw=2*k;
      cur.leaves.forEach(function(l){
        var fr=l.canvas.parentNode.getBoundingClientRect(), cr=l.canvas.getBoundingClientRect();
        cx.drawImage(l.canvas,(cr.left-pr.left)*k,(cr.top-pr.top)*k,cr.width*k,cr.height*k);
        cx.strokeStyle="#111"; cx.lineWidth=bw;
        cx.strokeRect((fr.left-pr.left)*k+bw/2,(fr.top-pr.top)*k+bw/2,fr.width*k-bw,fr.height*k-bw);
      });
      var an=document.createElement("a");
      an.download="pagina-"+(ipg+1)+".png"; an.href=out.toDataURL("image/png");
      document.body.appendChild(an); an.click(); an.remove();
    }
  });
  barra.addEventListener("change",function(ev){
    if(ev.target.getAttribute("data-v")==="layout"){
      garantir(); carregar(ev.target.value); marcarSujo();
    }
  });
  barra.addEventListener("input",function(ev){
    var a=ev.target.getAttribute("data-v");
    if(a==="cor"){ vFerr.c=ev.target.value; vFerr.t="p"; vSincronizarBarras(); }
    else if(a==="tam"){ vFerr.w=+ev.target.value; vSincronizarBarras(); }
  });

  carregar(v.ativo);
}

tela.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-acao]"); if(!b||!doc) return;
  var acao=b.getAttribute("data-acao");

  if(acao==="add-pagina"){
    abrirEscolhaQtd(b,function(n){
      doc.paginas.push(novaPagina(n)); marcarSujo(); desenhar();
    });
    return;
  }
  if(acao==="add-painel"){
    var pgId=b.getAttribute("data-pg");
    abrirEscolhaQtd(b,function(n,dupId){
      var k=acharPagina(pgId), i;
      if(k<0) return;
      if(dupId){
        var origem=acharPainelPorId(dupId);
        if(origem) doc.paginas[k].paineis.push(duplicarPainel(origem));
      }else{
        for(i=0;i<n;i++) doc.paginas[k].paineis.push(novoPainel());
      }
      marcarSujo(); desenhar();
    },{duplicaveis:listaDuplicaveis(20)});
    return;
  }
  if(acao==="duplicar-pagina"){
    var jd=acharPagina(b.getAttribute("data-pg"));
    if(jd>-1){ doc.paginas.splice(jd+1,0,duplicarPagina(doc.paginas[jd])); marcarSujo(); desenhar(); }
    return;
  }
  if(acao==="desenhar-painel"){
    var artD=b.closest(".painel");
    if(artD) abrirEditorDesenho(artD.getAttribute("data-pn"));
    return;
  }
  if(acao==="alt-info"){
    var locI=acharPainel(b);
    if(locI){
      var rec=!locI.painel.recolhido;
      if(rec) locI.painel.recolhido=true; else delete locI.painel.recolhido;
      var artI=b.closest(".painel");
      artI.classList.toggle("recolhido",rec);
      b.setAttribute("aria-expanded",rec?"false":"true");
      b.textContent=rec?"Mostrar informações":"Ocultar informações";
      marcarSujo();
    }
    return;
  }
  if(acao==="del-pagina"){
    var j=acharPagina(b.getAttribute("data-pg"));
    if(j>-1) confirmarClique(b,"Clique p/ confirmar",function(){
      apagarDesenhosDe([doc.paginas[j]]);
      doc.paginas.splice(j,1);
      if(!doc.paginas.length) doc.paginas=[novaPagina()];
      marcarSujo(); desenhar();
    });
    return;
  }

  var loc=acharPainel(b); if(!loc) return;
  var lst=loc.pagina.paineis;
  if(acao==="subir" && loc.ipn>0){
    lst.splice(loc.ipn-1,0,lst.splice(loc.ipn,1)[0]); marcarSujo(); desenhar();
  }else if(acao==="descer" && loc.ipn<lst.length-1){
    lst.splice(loc.ipn+1,0,lst.splice(loc.ipn,1)[0]); marcarSujo(); desenhar();
  }else if(acao==="duplicar-painel"){
    lst.splice(loc.ipn+1,0,duplicarPainel(loc.painel)); marcarSujo(); desenhar();
  }else if(acao==="del-painel"){
    confirmarClique(b,"✕ confirmar",function(){
      window.EditorDesenho.apagar(loc.painel.id);
      lst.splice(loc.ipn,1); marcarSujo(); desenhar();
    });
  }else if(acao==="toggle-personagem"){
    var nome=b.getAttribute("data-nome");
    loc.painel.personagens=loc.painel.personagens||[];
    var idxp=loc.painel.personagens.indexOf(nome);
    if(idxp>-1) loc.painel.personagens.splice(idxp,1); else loc.painel.personagens.push(nome);
    b.classList.toggle("ativo");
    marcarSujo();
    atualizarFraseResumo(loc);
  }else if(acao==="add-fala"){
    loc.painel.falas=loc.painel.falas||[];
    loc.painel.falas.push({quem:"",tipo:"fala",texto:""});
    marcarSujo(); desenhar();
    var art=tela.querySelector('[data-pn="'+loc.painel.id+'"]');
    var ta=art&&art.querySelectorAll('.fala textarea');
    if(ta&&ta.length) ta[ta.length-1].focus();
  }else if(acao==="del-fala"){
    var lf=ev.target.closest(".fala");
    var indiceFala=parseInt(lf.getAttribute("data-fala"),10);
    if(loc.painel.falas.length===1) loc.painel.falas[0]={quem:"",tipo:"fala",texto:""};
    else loc.painel.falas.splice(indiceFala,1);
    marcarSujo(); desenhar();
  }
});

function aoEditar(ev){
  var t=ev.target; if(!doc) return;
  var loc=acharPainel(t); if(!loc) return;

  var campo=t.getAttribute("data-campo");
  if(campo){
    loc.painel[campo]=t.value;
    marcarSujo();
    atualizarFraseResumo(loc);
    return;
  }

  var fc=t.getAttribute("data-fala-campo");
  if(fc){
    var lf=t.closest(".fala"), j=parseInt(lf.getAttribute("data-fala"),10);
    var f=loc.painel.falas[j]; if(!f) return;
    f[fc]=t.value;
    if(fc==="tipo") lf.className="fala balao-"+t.value;
    marcarSujo();
    atualizarPersonagens();
    atualizarFraseResumo(loc);
  }
}
tela.addEventListener("input",aoEditar);
tela.addEventListener("change",aoEditar);

/* datalist de personagens (junta o elenco cadastrado na obra + nomes já usados nas falas) */
var dl=document.createElement("datalist"); dl.id="personagens"; document.body.appendChild(dl);
function atualizarPersonagens(){
  if(!doc) return;
  var set={};
  var o=obraObjAtual();
  ((o&&o.personagens)||[]).forEach(function(n){ set[n]=1; });
  doc.paginas.forEach(function(pg){(pg.paineis||[]).forEach(function(pn){
    (pn.falas||[]).forEach(function(f){ if(f.quem&&f.quem.trim()) set[f.quem.trim()]=1; });
  });});
  dl.innerHTML=Object.keys(set).map(function(n){return '<option value="'+esc(n)+'">';}).join("");
}

/* ========== exportação ========== */
function nomeObra(){
  var o=obras.filter(function(x){return x.id===(doc&&doc.obraId);})[0];
  return o?(o.titulo||"Sem título"):"Sem título";
}
function fichaPainel(pn){
  var itens=[];
  if(pn.enquadramento) itens.push("Enquadramento: "+pn.enquadramento);
  else if(pn.tipoPainel) itens.push("Enquadramento: "+pn.tipoPainel);
  if(pn.distancia) itens.push("Distância: "+pn.distancia);
  if(pn.plano) itens.push("Plano: "+pn.plano);
  if(pn.angulo) itens.push("Ângulo: "+pn.angulo);
  if(pn.tamanho&&TAMANHOS[pn.tamanho]) itens.push("Tamanho: "+nomeTamanho(pn.tamanho));
  if(!itens.length && pn.enq) itens.push(pn.enq);
  return itens.join(" · ");
}
function paraTexto(){
  if(!doc) return "";
  var L=[];
  L.push(nomeObra().toUpperCase());
  L.push("Capítulo "+(doc.numero||1)+(doc.titulo?" — "+doc.titulo:""));
  L.push("");
  doc.paginas.forEach(function(pg,ip){
    var np=(pg.paineis||[]).length;
    L.push("=== PÁGINA "+(ip+1)+" ("+np+(np===1?" painel":" painéis")+") ===");
    if(pg.visual&&LAYOUTS_VISUAIS[pg.visual.ativo]) L.push("Layout visual: "+LAYOUTS_VISUAIS[pg.visual.ativo].nome);
    L.push("");
    (pg.paineis||[]).forEach(function(pn,i){
      var ficha=fichaPainel(pn);
      L.push("PAINEL "+(i+1)+(ficha?"  ["+ficha+"]":""));
      L.push("   → "+fraseResumoPainel(pn));
      if(pn.acao) L.push(pn.acao.trim());
      if(pn.personagens && pn.personagens.length) L.push("   Em cena: "+pn.personagens.join(", "));
      (pn.falas||[]).forEach(function(f){
        var texto=(f.texto||"").trim();
        if(!texto) return;
        var tipo=f.tipo||"fala";
        var quem=(f.quem||"").trim();
        if(tipo==="narracao") L.push("   NARRAÇÃO: "+texto);
        else{
          var suf=ROTULO_BALAO[tipo]?(" "+ROTULO_BALAO[tipo]):"";
          L.push("   "+(quem||"—")+suf+": "+texto);
        }
      });
      if(pn.sfx) L.push("   SFX: "+pn.sfx.trim());
      if(pn.nota) L.push("   Nota: "+pn.nota.trim());
      L.push("");
    });
  });
  return L.join("\n");
}

el("btExportar").onclick=function(){
  el("saidaTexto").value=paraTexto();
  el("dlgExport").showModal();
};
el("fecharDlg").onclick=function(){ el("dlgExport").close(); };
el("btCopiar").onclick=async function(){
  var t=el("saidaTexto");
  try{ await navigator.clipboard.writeText(t.value); aviso("Texto copiado."); }
  catch(e){ t.focus(); t.select(); aviso("Use Ctrl+C para copiar o texto selecionado."); }
};
el("btBaixar").onclick=async function(){
  if(!baixador){ aviso("Download indisponível aqui — copie o texto."); return; }
  var nome=(nomeObra()+" cap "+(doc.numero||1)).replace(/[^\wÀ-ÿ \-]/g,"").trim()+".txt";
  try{ await baixador.save({filename:nome,data:paraTexto()}); }
  catch(e){ aviso("Download não concluído."); }
};

window.addEventListener("beforeunload",function(e){
  if(sujo){ e.preventDefault(); e.returnValue=""; }
});

/* ========== arranque ========== */
tela.innerHTML='<div class="centro"><h2>Abrindo a mesa…</h2><p>Buscando suas obras.</p></div>';
(async function(){
  await iniciarArmazenamento();
  if(!db){
    tela.innerHTML='<div class="centro"><h2>Sem armazenamento nesta visualização</h2>'+
      '<p>Esta página guarda os roteiros na sua conta. Abra o link pela sua conta Claude para escrever e salvar.</p></div>';
    estado.textContent="";
    return;
  }
  try{ await carregarListas(); }catch(e){}
  desenharLateral();
  var ult=caps.filter(function(c){return true;});
  if(ult.length){ obraAtual=ult[ult.length-1].obraId; await abrirCapitulo(ult[ult.length-1].id); }
  else{ desenhar(); }
  atualizarPersonagens();
})();
})();
</script>
