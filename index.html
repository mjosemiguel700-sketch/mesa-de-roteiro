<style>
:root{
  --tinta:#111111;
  --papel:#FFFFFF;
  --papel-2:#EDEDED;
  --calha:#CCCCCC;
  --selo:#000000;
  --anil:#333333;
  --fraco:#666666;
  --sombra:rgba(0,0,0,.15);
  --mincho:"Shippori Mincho B1",Georgia,"Times New Roman",serif;
  --gotico:"Zen Kaku Gothic New","Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --tinta:#F2F2F2; --papel:#111111; --papel-2:#1C1C1C; --calha:#3A3A3A;
    --selo:#FFFFFF; --anil:#CFCFCF; --fraco:#999999; --sombra:rgba(255,255,255,.12);
  }
}
:root[data-theme="dark"]{
  --tinta:#F2F2F2; --papel:#111111; --papel-2:#1C1C1C; --calha:#3A3A3A;
  --selo:#FFFFFF; --anil:#CFCFCF; --fraco:#999999; --sombra:rgba(255,255,255,.12);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;background:var(--papel);color:var(--tinta);
  font-family:var(--gotico);font-size:15px;line-height:1.55;
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--tinta);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- estrutura ---------- */
.app{display:flex;height:100%;min-height:0}
.lateral{
  width:272px;flex:0 0 272px;background:var(--papel-2);
  border-right:1px solid var(--calha);display:flex;flex-direction:column;min-height:0;
}
.marca{padding:18px 18px 12px;border-bottom:1px solid var(--calha)}
.marca h1{
  margin:0;font-family:var(--mincho);font-weight:700;font-size:22px;letter-spacing:.02em;line-height:1.2;
}
.marca p{margin:2px 0 0;font-size:12px;color:var(--fraco)}
.rolagem{overflow-y:auto;flex:1;min-height:0;padding:12px 10px 24px}
.grupo-titulo{
  font-family:var(--mincho);font-size:13px;font-weight:700;color:var(--fraco);
  padding:8px 8px 6px;display:flex;justify-content:space-between;align-items:center;gap:8px;
}
.item{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  background:none;border:0;border-left:3px solid transparent;
  padding:7px 8px;border-radius:0 4px 4px 0;cursor:pointer;
}
.item:hover{background:var(--papel)}
.item[aria-current="true"]{border-left-color:var(--tinta);background:var(--papel);font-weight:700}
.item .rotulo{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .contagem{font-size:11px;color:var(--fraco);font-variant-numeric:tabular-nums}
.obra-item-wrap{display:flex;align-items:center;gap:2px}
.obra-item-wrap .item{flex:1;min-width:0}
.obra-item-wrap .acao-obra{margin-right:2px;font-size:11px;flex:0 0 auto;}
.item.cap{padding-left:18px;font-size:14px}
.vazio-lateral{padding:10px 10px;font-size:13px;color:var(--fraco)}

.personagem-item{display:flex;align-items:center;gap:6px;padding:5px 8px;font-size:13px}
.personagem-item .rotulo{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- botões ---------- */
.bt{
  border:1px solid var(--calha);background:var(--papel);color:var(--tinta);
  border-radius:3px;padding:5px 10px;font-size:13px;cursor:pointer;
}
.bt:hover{border-color:var(--tinta)}
.bt.forte{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}
.bt.forte:hover{opacity:.85}
.bt.mini{padding:2px 7px;font-size:12px;line-height:1.5}
.bt.risco{color:var(--selo);font-weight:700}
.bt:disabled{opacity:.4;cursor:default}
.bt-texto{background:none;border:0;color:var(--fraco);cursor:pointer;font-size:12px;padding:2px 4px;border-radius:3px}
.bt-texto:hover{color:var(--tinta);background:var(--papel-2)}
.bt-texto.risco{color:var(--tinta);font-weight:700;text-decoration:underline}

/* ---------- área principal ---------- */
.principal{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.barra{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:12px 20px;border-bottom:1px solid var(--calha);background:var(--papel);
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
}
.barra .tit{flex:1;min-width:140px}
.barra .tit input{
  width:100%;background:none;border:0;border-bottom:1px dashed transparent;
  font-family:var(--mincho);font-size:19px;font-weight:700;padding:2px 0;
}
.barra .tit input:hover{border-bottom-color:var(--calha)}
.barra .tit input:focus{outline:none;border-bottom-color:var(--tinta)}
.estado{font-size:12px;color:var(--fraco);min-width:74px;text-align:right}
.tela{flex:1;overflow-y:auto;min-height:0;padding:22px 20px 96px}
.folha{max-width:780px;margin:0 auto}

/* ---------- página ---------- */
.pagina{margin:0 0 34px}
.cabeca-pagina{
  display:flex;align-items:baseline;gap:12px;
  border-bottom:2px solid var(--tinta);padding-bottom:5px;margin-bottom:14px;
}
.cabeca-pagina h2{margin:0;font-family:var(--mincho);font-size:17px;font-weight:700}
.cabeca-pagina .info{font-size:12px;color:var(--fraco);flex:1}
.aviso-densidade{color:var(--tinta);font-weight:700;text-decoration:underline}

/* ---------- painel ---------- */
.painel{
  background:var(--papel);border:2px solid var(--tinta);
  box-shadow:3px 3px 0 var(--sombra);
  margin-bottom:14px;position:relative;
}
.painel-topo{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:8px 10px;border-bottom:1px solid var(--calha);background:var(--papel-2);
}
.num{
  font-family:var(--mincho);font-weight:700;font-size:15px;
  min-width:26px;height:26px;display:grid;place-items:center;
  background:var(--tinta);color:var(--papel);padding:0 6px;
}
.painel-topo select{
  background:var(--papel);border:1px solid var(--calha);border-radius:3px;
  padding:3px 6px;font-size:13px;max-width:210px;
}
.acoes{margin-left:auto;display:flex;gap:2px}
.corpo{padding:10px}
.campo{margin-bottom:10px}
.campo:last-child{margin-bottom:0}
.campo > label{display:block;font-size:12px;color:var(--fraco);margin-bottom:3px}
textarea,input[type=text]{
  width:100%;background:transparent;border:1px solid var(--calha);border-radius:3px;
  padding:7px 8px;resize:vertical;
}
textarea:focus,input[type=text]:focus{outline:none;border-color:var(--tinta)}
textarea.acao{min-height:58px;line-height:1.5}
textarea.sfx{min-height:36px;font-family:var(--mincho);font-weight:700;letter-spacing:.06em}
textarea.nota{min-height:36px;color:var(--anil);font-size:13.5px;font-style:italic}

.painel-rotulo{font-family:var(--mincho);font-weight:700;font-size:14px;color:var(--fraco)}

.frase-resumo{
  font-size:13px;font-style:italic;color:var(--fraco);
  border-left:3px solid var(--tinta);padding:6px 10px;margin-bottom:12px;
  background:var(--papel-2);
}

/* ---------- chips de personagens ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  border:1px solid var(--tinta);background:var(--papel);color:var(--tinta);
  border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;
}
.chip.ativo{background:var(--tinta);color:var(--papel);font-weight:700}

/* ---------- escolhas de composição do painel ---------- */
.campos-painel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.campos-painel .campo{margin:0}
.campos-painel select{
  width:100%;background:var(--papel);border:1px solid var(--calha);border-radius:3px;
  padding:6px 7px;font-size:13px;
}
.campos-painel select:focus{outline:none;border-color:var(--tinta)}

/* ---------- falas ---------- */
.fala{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px;flex-wrap:wrap}
.fala .quem{flex:0 0 26%;min-width:96px}
.fala .quem input{font-weight:700}
.fala .diz{flex:1;min-width:160px}
.fala textarea{min-height:38px}
.fala .tipo-balao{flex:0 0 128px}
.fala .tipo-balao select{
  width:100%;background:var(--papel);border:1px solid var(--calha);border-radius:3px;
  padding:6px 7px;font-size:12.5px;height:100%;
}
.fala .rm{flex:0 0 auto;align-self:center}

/* ---------- detalhes recolhíveis ---------- */
details.detalhes{margin-top:4px;border-top:1px solid var(--calha);padding-top:2px}
details.detalhes summary{
  cursor:pointer;font-size:12px;color:var(--fraco);padding:6px 0;list-style:none;
  display:flex;align-items:center;gap:5px;
}
details.detalhes summary::-webkit-details-marker{display:none}
details.detalhes summary::before{content:"▸";font-size:10px}
details.detalhes[open] summary::before{content:"▾"}
details.detalhes summary:hover{color:var(--tinta)}
details.detalhes .campo{margin-top:8px}

.add-linha{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.add-pagina{
  width:100%;border:1px dashed var(--calha);background:none;color:var(--fraco);
  padding:12px;cursor:pointer;border-radius:4px;font-size:14px;
}
.add-pagina:hover{border-color:var(--tinta);color:var(--tinta)}

/* ---------- vazio / boas-vindas ---------- */
.centro{max-width:560px;margin:8vh auto;text-align:left}
.centro h2{font-family:var(--mincho);font-size:26px;margin:0 0 10px}
.centro p{color:var(--fraco);margin:0 0 18px;max-width:52ch}

/* ---------- painel de exportação ---------- */
dialog{
  border:2px solid var(--tinta);background:var(--papel);color:var(--tinta);
  padding:0;max-width:min(760px,92vw);width:100%;box-shadow:6px 6px 0 var(--sombra);
}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg-topo{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--calha)}
.dlg-topo h3{margin:0;font-family:var(--mincho);font-size:17px;flex:1}
.dlg-corpo{padding:14px}
.dlg-corpo textarea{min-height:min(52vh,420px);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5}
.dlg-pe{display:flex;gap:8px;justify-content:flex-end;padding:0 14px 14px;flex-wrap:wrap}

/* ---------- popover: escolha de quantidade ---------- */
.pop-qtd{
  position:fixed;z-index:60;background:var(--papel);border:1px solid var(--tinta);
  box-shadow:3px 3px 0 var(--sombra);border-radius:4px;padding:6px;min-width:200px;
  max-width:min(320px,86vw);max-height:min(70vh,420px);overflow-y:auto;
}
.pop-qtd-titulo{font-size:11px;color:var(--fraco);padding:2px 6px 4px}
.pop-qtd-sep{margin-top:5px;padding-top:7px;border-top:1px solid var(--calha)}
.pop-qtd-item{
  display:block;width:100%;text-align:left;background:none;border:0;
  padding:7px 8px;border-radius:3px;cursor:pointer;font-size:13.5px;color:var(--tinta);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.pop-qtd-item:hover{background:var(--papel-2)}
.pop-qtd-outro{display:flex;gap:5px;margin-top:5px;padding-top:5px;border-top:1px solid var(--calha)}
.pop-qtd-outro input{
  width:0;flex:1;background:var(--papel);border:1px solid var(--calha);border-radius:3px;padding:5px 6px;font-size:13px;
}

/* ---------- aviso ---------- */
.aviso{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(18px + env(safe-area-inset-bottom,0px));
  background:var(--tinta);color:var(--papel);padding:9px 16px;border-radius:4px;
  font-size:13px;z-index:200;max-width:88vw;
}
.oculto{display:none!important}

/* ---------- mobile ---------- */
.bt-menu{display:none}
@media (max-width:820px){
  .app{position:relative}
  .lateral{
    position:fixed;z-index:20;top:0;bottom:0;left:0;width:84vw;max-width:300px;
    transform:translateX(-102%);transition:transform .18s ease;
    padding-top:env(safe-area-inset-top,0px);
  }
  .lateral.aberta{transform:none}
  .bt-menu{display:inline-flex}
  .fundo-lateral{
    display:none;position:fixed;inset:0;z-index:19;background:rgba(0,0,0,.4);
  }
  .fundo-lateral.aberta{display:block}
  .tela{padding:16px 12px 96px}
  .barra{padding:10px 12px}
  .fala{flex-wrap:wrap}
  .fala .quem{flex:1 1 100%;min-width:0}
  .fala .diz{flex:1 1 100%}
  .fala .tipo-balao{flex:1 1 100%}
}
@media (max-width:520px){.campos-painel{grid-template-columns:1fr}}

/* ---------- layout visual (quadros de mangá) ---------- */
details.visual-pg{margin:0 0 14px;padding:0 10px;border:1px solid var(--calha);background:var(--papel-2)}
details.visual-pg summary{padding:9px 0}
.vis-barra{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:4px 0 8px}
.vis-barra select{background:var(--papel);border:1px solid var(--calha);border-radius:3px;padding:3px 6px;font-size:13px}
.vis-barra input[type=color]{width:30px;height:26px;padding:0;border:1px solid var(--calha);background:none;cursor:pointer}
.vis-barra input[type=range]{width:90px}
.vis-pagina{position:relative;width:min(100%,460px);aspect-ratio:5/7;margin:4px auto 6px;background:#fff;box-shadow:3px 3px 0 var(--sombra)}
.vis-cell{position:absolute}
.vis-frame{position:absolute;inset:5px;border:2px solid #111;background:#fff;overflow:hidden}
.vis-frame canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.vis-num{position:absolute;left:4px;top:2px;font-family:var(--mincho);font-weight:700;font-size:12px;color:#9a9a9a;pointer-events:none}
.vis-gutter{position:absolute;z-index:5;touch-action:none}

<script>
/* Armazenamento local: guarda tudo no localStorage do próprio navegador.
   Funciona sempre — publicado, compartilhado publicamente, ou baixado como
   arquivo — sem depender de login na conta Claude. Por navegador/aparelho:
   os dados não sincronizam entre celular e computador, por exemplo. */
(function(){
"use strict";

var P="mesa:", mem={}, ls=null;
try{ ls=window.localStorage; ls.setItem(P+"_t","1"); ls.removeItem(P+"_t"); }catch(e){ ls=null; }

function ler(k){ return ls ? ls.getItem(P+k) : (k in mem ? mem[k] : null); }
function gravar(k,v){
  try{ if(ls) ls.setItem(P+k,v); else mem[k]=v; }
  catch(e){ var er=new Error("Armazenamento cheio"); er.code="quota_exceeded"; throw er; }
}
function apagar(k){ if(ls) ls.removeItem(P+k); else delete mem[k]; }
function chaves(){
  var out=[],i,k;
  if(ls){ for(i=0;i<ls.length;i++){ k=ls.key(i); if(k.indexOf(P)===0) out.push(k.slice(P.length)); } }
  else out=Object.keys(mem);
  return out;
}
function novoId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function docRef(path){
  var id=path.split("/").pop();
  return {
    path:path, id:id,
    get:async function(){
      var v=ler(path);
      return {exists:v!==null, id:id, data:function(){ return v===null?undefined:JSON.parse(v); }};
    },
    set:async function(d){ gravar(path,JSON.stringify(d)); },
    update:async function(d){
      var v=ler(path), o=v?JSON.parse(v):{}, k;
      for(k in d) o[k]=d[k];
      gravar(path,JSON.stringify(o));
    },
    delete:async function(){ apagar(path); }
  };
}

function consulta(cp,campo,dir){
  return {
    orderBy:function(c,d){ return consulta(cp,c,d||"asc"); },
    get:async function(){
      var pre=cp+"/";
      var docs=chaves().filter(function(k){
        return k.indexOf(pre)===0 && k.indexOf("/",pre.length)<0;
      }).map(function(k){
        var d=JSON.parse(ler(k));
        return {id:k.slice(pre.length), ref:docRef(k), data:function(){ return d; }};
      });
      if(campo) docs.sort(function(a,b){
        var x=a.data()[campo], y=b.data()[campo], r=x<y?-1:(x>y?1:0);
        return dir==="desc"?-r:r;
      });
      return {docs:docs, size:docs.length, empty:!docs.length, forEach:function(f){ docs.forEach(f); }};
    }
  };
}

}

    if(!db) return BD.mem[id]||null;

  var out=[];
  String(txt).split("\n").forEach(function(par){
    var pal=par.split(/\s+/).filter(Boolean), lin="";
    if(!pal.length){ out.push(""); return; }

}

    var l=quebrarTexto(c,b.txt,a.w), larg=0;
    l.forEach(function(s){ larg=Math.max(larg,c.measureText(s).width); });
    return {l:l,ok:larg<=a.w*1.001&&l.length*f*1.2<=a.h};

    for(fs=Math.min(110,Math.floor(a.h));fs>=10;fs-=2){ var r=tenta(fs); if(r.ok){ lin=r.l; break; } }
    if(fs<10){ fs=10; lin=tenta(fs).l; }

function cauda(c,b,cx,cy,rx,ry,lw,fator){

function caudaRet(c,b,lw){
  var cx=b.x+b.w/2, cy=b.y+b.h/2, rx=b.w/2, ry=b.h/2, dx=b.px-cx, dy=b.py-cy;

  var d=r*2+2, c=novoCanvas(d,d), x=c.getContext("2d"), rgb=hexRgb(cor);

    for(j=0;j<d;j++) for(i=0;i<d;i++){
      var dx=i-r-0.5, dy=j-r-0.5, dist=Math.sqrt(dx*dx+dy*dy)/r;

}

/* cor: roda de matiz + quadrado de saturação/valor */
var HSV={h:0,s:0,v:0}, RODA={W:148,ro:70,ri:52};
function hsv2hex(h,s,v){
  var f=function(n){ var k=(n+h/60)%6; return v-v*s*Math.max(0,Math.min(k,4-k,1)); };
  return "#"+[f(5),f(3),f(1)].map(function(x){ var t=Math.round(x*255).toString(16); return t.length<2?"0"+t:t; }).join("");
}
function hex2hsv(hex){
  var r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255, b=parseInt(hex.slice(5,7),16)/255;
  var mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn, h=0;
  if(d){
    if(mx===r) h=((g-b)/d)%6; else if(mx===g) h=(b-r)/d+2; else h=(r-g)/d+4;
    h*=60; if(h<0) h+=360;
  }
  return {h:h,s:mx?d/mx:0,v:mx};
}
function desenharRoda(){
  var cv=E.roda; if(!cv) return;
  var d=window.devicePixelRatio||1, W=RODA.W, ro=RODA.ro, ri=RODA.ri, cx=W/2, a;
  if(cv.width!==Math.round(W*d)){ cv.width=cv.height=Math.round(W*d); cv.style.width=cv.style.height=W+"px"; }
  var c=cv.getContext("2d"); c.setTransform(d,0,0,d,0,0); c.clearRect(0,0,W,W);
  c.lineWidth=ro-ri; c.lineCap="butt";
  for(a=0;a<360;a+=2){
    c.beginPath(); c.arc(cx,cx,(ro+ri)/2,(a-0.6)*Math.PI/180,(a+2.6)*Math.PI/180);
    c.strokeStyle="hsl("+a+",100%,50%)"; c.stroke();
  }
  var sd=ri*0.7, x0=cx-sd, side=sd*2, g;
  c.fillStyle=hsv2hex(HSV.h,1,1); c.fillRect(x0,x0,side,side);
  g=c.createLinearGradient(x0,0,x0+side,0); g.addColorStop(0,"#fff"); g.addColorStop(1,"rgba(255,255,255,0)");
  c.fillStyle=g; c.fillRect(x0,x0,side,side);
  g=c.createLinearGradient(0,x0,0,x0+side); g.addColorStop(0,"rgba(0,0,0,0)"); g.addColorStop(1,"#000");
  c.fillStyle=g; c.fillRect(x0,x0,side,side);
  var ang=HSV.h*Math.PI/180, rm=(ro+ri)/2;
  [[cx+Math.cos(ang)*rm,cx+Math.sin(ang)*rm],[x0+HSV.s*side,x0+(1-HSV.v)*side]].forEach(function(p){
    c.beginPath(); c.arc(p[0],p[1],5,0,Math.PI*2); c.lineWidth=2; c.strokeStyle="#fff"; c.stroke();
    c.beginPath(); c.arc(p[0],p[1],6.2,0,Math.PI*2); c.lineWidth=1; c.strokeStyle="#000"; c.stroke();
  });
}
function rodaPonteiro(e,modo){
  var r=E.roda.getBoundingClientRect(), k=RODA.W/r.width, x=(e.clientX-r.left)*k, y=(e.clientY-r.top)*k;
  var cx=RODA.W/2, dx=x-cx, dy=y-cx, dist=Math.hypot(dx,dy), sd=RODA.ri*0.7;
  if(!modo){
    if(dist>=RODA.ri-2&&dist<=RODA.ro+4) modo="h";
    else if(Math.abs(dx)<=sd+4&&Math.abs(dy)<=sd+4) modo="sv";
    else return null;
  }
  if(modo==="h") HSV.h=(Math.atan2(dy,dx)*180/Math.PI+360)%360;
  else{ HSV.s=clamp((dx+sd)/(sd*2),0,1); HSV.v=1-clamp((dy+sd)/(sd*2),0,1); }
  definirCor(hsv2hex(HSV.h,HSV.s,HSV.v),true);
  return modo;
}

function desenharNav(){
  if(!S||!E.nav||S.carregando) return;
  var cv=E.nav, W=cv.clientWidth, H=cv.clientHeight; if(!W||!H) return;
  var d=window.devicePixelRatio||1;
  if(cv.width!==Math.round(W*d)||cv.height!==Math.round(H*d)){ cv.width=Math.round(W*d); cv.height=Math.round(H*d); }
  var c=cv.getContext("2d"), k=Math.min((W-10)/S.dim.w,(H-10)/S.dim.h), ox=(W-S.dim.w*k)/2, oy=(H-S.dim.h*k)/2;
  c.setTransform(d,0,0,d,0,0); c.fillStyle="#8c8c8c"; c.fillRect(0,0,W,H);
  c.save(); c.translate(ox,oy); c.scale(k,k); c.imageSmoothingQuality="medium";

/* ---------- abrir / fechar ---------- */
function abrir(opts){
  montarDOM();
  if(S) return;
  var painel=opts.painel;
  var chave=TAMANHOS[painel.tamanho]?painel.tamanho:PADRAO_TAM;
  var dim=dimensoes(chave);
  var s=S={
    opts:opts,painel:painel,chave:chave,dim:dim,camadas:[],ativa:null,
    hist:[],refaz:[],bytes:0,
    z:1,tx:0,ty:0,pw:0,ph:0,dpr:window.devicePixelRatio||1,ajustado:true,
    ptrs:{},nptr:0,vivo:null,flut:null,sel:null,selOp:null,baloes:[],balSel:null,balOp:null,balIni:null,balSnap:null,balValId:null,
    tmp:novoCanvas(dim.w,dim.h),live:novoCanvas(dim.w,dim.h),
    sujoView:true,sujoOver:true,carregando:true,tocou:false,sujo:false,
    espaco:false,tSalvar:null,cursor:null,pan:null,gesto:null,raf:0,
    ferr:CFG.ferr,ferrAnt:"caneta",propIni:null
  };
  $ed.classList.remove("oculto"); document.body.classList.add("ed-aberto");
  E.carregando.classList.remove("oculto");
  E.titulo.textContent=opts.titulo||"Painel";
  E.tam.value=chave;
  E.borda.value=bordaAtual(); E.bordaV.textContent=bordaAtual();
  qa("[data-ed=ant]").forEach(function(b){ b.disabled=!opts.ant; }); qa("[data-ed=prox]").forEach(function(b){ b.disabled=!opts.prox; });
  fecharMenus(); E.ajuda.classList.add("oculto");
  E.estado.textContent="";
  E.lat.classList.remove("aberta");
  ajustarCanvasPalco();
  atualizarFerr(); atualizarBotoesHist();
  document.addEventListener("keydown",onKey,true);
  document.addEventListener("keyup",onKeyUp,true);
  $ed.focus();

  bdLer(painel.id).then(function(rec){
    if(S!==s) return;
    if(!rec||!rec.camadas||!rec.camadas.length){
      var L=criarCamada("Camada 1"); s.camadas=[L]; s.ativa=L.id; return pronto();
    }
    s.tocou=true;
    var ox=Math.round((dim.w-(rec.w||dim.w))/2), oy=Math.round((dim.h-(rec.h||dim.h))/2);
    s.baloes=(rec.baloes||[]).map(function(b){
      var c=cloneBal(b); c.x+=ox; c.y+=oy; c.px+=ox; c.py+=oy; return c;
    });
    var pend=rec.camadas.map(function(c){
      var L=criarCamada(c.nome||"Camada",c.id);
      L.vis=c.vis!==false; L.op=c.op==null?100:c.op; L.modo=c.modo||"normal"; L.blob=c.blob||null; L.sujo=false;
      s.camadas.push(L);
      return decodificar(c.blob).then(function(img){
        if(img){ L.cx.drawImage(img,ox,oy); if(ox||oy) L.sujo=true; }
      });
    });
    return Promise.all(pend).then(function(){
      var ok=s.camadas.some(function(L){ return L.id===rec.ativa; });
      s.ativa=ok?rec.ativa:s.camadas[s.camadas.length-1].id;
      pronto();
    });
  });
  function pronto(){
    if(S!==s) return;
    s.carregando=false; E.carregando.classList.add("oculto");
    ajustar(); listaCamadas(); pedir(true); atualizarBal();
  }
}

function decodificar(blob){
  if(!blob) return Promise.resolve(null);
  if(window.createImageBitmap) return createImageBitmap(blob).catch(function(){ return null; });
  return new Promise(function(res){
    var u=URL.createObjectURL(blob), im=new Image();
    im.onload=function(){ URL.revokeObjectURL(u); res(im); };
    im.onerror=function(){ res(null); };
    im.src=u;
  });
}

function criarCamada(nome,id){
  var c=novoCanvas(S.dim.w,S.dim.h);
  return {id:id||nid(),nome:nome,vis:true,op:100,modo:"normal",cv:c,cx:c.getContext("2d"),sujo:true,blob:null};
}
function porId(id){ for(var i=0;i<S.camadas.length;i++) if(S.camadas[i].id===id) return S.camadas[i]; return null; }
function camadaAtiva(){ return porId(S.ativa); }
function qa(sel){ return Array.prototype.slice.call($ed.querySelectorAll(sel)); }
function aviso(t){ if(S&&S.opts.aviso) S.opts.aviso(t); }
function bordaAtual(){
  var b=S&&S.painel.borda;
  return typeof b==="number"?b:BORDA_PADRAO;
}

function sair(depois){
  if(!S) return Promise.resolve();
  var s=S; commitFlut();
  return salvarAgora().then(function(){
    document.removeEventListener("keydown",onKey,true);
    document.removeEventListener("keyup",onKeyUp,true);
    cancelAnimationFrame(s.raf);
    $ed.classList.add("oculto"); document.body.classList.remove("ed-aberto");
    S=null;
    if(s.opts.aoFechar) s.opts.aoFechar(s.painel);
    if(depois) depois();
  });
}

/* ---------- salvar ---------- */
function agendarSalvar(){
  if(!S) return;
  S.sujo=true; E.estado.textContent="não salvo";
  clearTimeout(S.tSalvar); S.tSalvar=setTimeout(salvarAgora,800);
}
function salvarAgora(){
  var s=S; if(!s) return Promise.resolve();
  clearTimeout(s.tSalvar);
  if(!s.sujo) return Promise.resolve();
  s.sujo=false; E.estado.textContent="salvando…";
  return Promise.all(s.camadas.map(function(L){
    if(L.blob&&!L.sujo) return Promise.resolve();
    L.sujo=false;
    return new Promise(function(res){ L.cv.toBlob(function(b){ L.blob=b; res(); },"image/png"); });
  })).then(function(){
    var rec={v:1,w:s.dim.w,h:s.dim.h,ativa:s.ativa,baloes:s.baloes.map(cloneBal),camadas:s.camadas.map(function(L){
      return {id:L.id,nome:L.nome,vis:L.vis,op:L.op,modo:L.modo,blob:L.blob};
    })};
    return bdGravar(s.painel.id,rec);
  }).then(function(ok){
    if(s.tocou){ s.painel.miniatura=miniatura(s); s.painel.temDesenho=true; }
    if(s.opts.aoMudar) s.opts.aoMudar();
    if(S===s) E.estado.textContent=ok?"salvo":"salvo só até fechar a aba";
  });
}
function miniatura(s){
  var k=320/Math.max(s.dim.w,s.dim.h);
  var c=novoCanvas(Math.max(1,Math.round(s.dim.w*k)),Math.max(1,Math.round(s.dim.h*k))), x=c.getContext("2d");
  x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height);
  x.save(); x.scale(k,k); x.imageSmoothingQuality="high";
  camadasEm(x,false,s); desenharBorda(x,s); desenharBaloes(x,s.baloes,Math.max(s.dim.w,s.dim.h)); x.restore();
  return c.toDataURL("image/jpeg",0.72);
}

/* ---------- composição ---------- */
function camadaEfetiva(s,L){
  if(L.id!==s.ativa||(!s.vivo&&!s.flut)) return L.cv;
  var t=s.tmp, c=t.getContext("2d");
  c.globalAlpha=1; c.globalCompositeOperation="source-over";
  c.clearRect(0,0,s.dim.w,s.dim.h); c.drawImage(L.cv,0,0);
  var f=s.flut;
  if(f){ c.imageSmoothingQuality="high"; c.drawImage(f.cv,0,0,f.ow,f.oh,f.x,f.y,f.w,f.h); }
  var v=s.vivo;
  if(v){
    c.globalAlpha=v.op; c.globalCompositeOperation=v.borracha?"destination-out":"source-over";
    c.drawImage(v.cv,0,0);
    c.globalAlpha=1; c.globalCompositeOperation="source-over";
  }
  return t;
}
function camadasEm(c,efetivas,s){
  s=s||S;
  s.camadas.forEach(function(L){
    if(!L.vis) return;
    c.globalAlpha=L.op/100;
    c.globalCompositeOperation=opComp(L.modo);
    c.drawImage(efetivas?camadaEfetiva(s,L):L.cv,0,0);
  });
  c.globalAlpha=1; c.globalCompositeOperation="source-over";
}
function desenharBorda(c,s){
  s=s||S;
  var b=typeof s.painel.borda==="number"?s.painel.borda:BORDA_PADRAO; if(b<=0) return;
  c.save(); c.strokeStyle="#111"; c.lineWidth=b;
  c.strokeRect(b/2,b/2,s.dim.w-b,s.dim.h-b); c.restore();
}

/* ---------- tela: palco, zoom e quadros ---------- */
function ajustarCanvasPalco(){
  var r=E.palco.getBoundingClientRect(); if(!r.width||!r.height) return;
  var d=window.devicePixelRatio||1;
  [E.view,E.over].forEach(function(c){ c.width=Math.round(r.width*d); c.height=Math.round(r.height*d); });
  if(S){ S.dpr=d; S.pw=r.width; S.ph=r.height; }
}
function ajustar(){
  if(!S||!S.pw) return;
  var m=28, z=Math.min((S.pw-m*2)/S.dim.w,(S.ph-m*2)/S.dim.h);
  S.z=clamp(z,0.05,1.5); S.tx=(S.pw-S.dim.w*S.z)/2; S.ty=(S.ph-S.dim.h*S.z)/2;
  S.ajustado=true; atualizarZoom(); pedir(true);
}
function zoomEm(f,cx,cy){
  var nz=clamp(S.z*f,0.05,16); f=nz/S.z;
  S.tx=cx-(cx-S.tx)*f; S.ty=cy-(cy-S.ty)*f; S.z=nz; S.ajustado=false;
  atualizarZoom(); pedir(true);
}
function zoomCentro(f){ zoomEm(f,S.pw/2,S.ph/2); }
function atualizarZoom(){
  E.zoom.textContent=Math.round(S.z*100)+"%";
  E.dimTxt.textContent=S.dim.w+" × "+S.dim.h+" px";
  E.navZoom.value=clamp(100*Math.log(S.z/0.05)/Math.log(320),0,100);
  pedirNav();
}
function pedir(view){
  if(!S) return;
  if(view) S.sujoView=true;
  S.sujoOver=true;
  if(!S.raf) S.raf=requestAnimationFrame(quadro);
}
function quadro(){
  var s=S; if(!s) return; s.raf=0;
  if(s.sujoView){ s.sujoView=false; renderView(); pedirNav(); }
  if(s.sujoOver){ s.sujoOver=false; renderOver(); }
}
function renderView(){
  var v=E.view, c=v.getContext("2d"), d=S.dpr, z=S.z;
  c.setTransform(1,0,0,1,0,0); c.fillStyle="#a4a4a4"; c.fillRect(0,0,v.width,v.height);
  c.setTransform(d*z,0,0,d*z,d*S.tx,d*S.ty);
  c.imageSmoothingEnabled=z<2; c.imageSmoothingQuality="high";
  c.fillStyle="#fff"; c.fillRect(0,0,S.dim.w,S.dim.h);
  if(!S.carregando) camadasEm(c,true);
  desenharBorda(c);
  if(!S.carregando) desenharBaloes(c,S.baloes,Math.max(S.dim.w,S.dim.h));
}
var ALCAS=["nw","n","ne","e","se","s","sw","w"];
function posAlca(r,h){
  var x=S.tx+r.x*S.z, y=S.ty+r.y*S.z, w=r.w*S.z, hh=r.h*S.z;
  var px=h.indexOf("w")>-1?x:(h.indexOf("e")>-1?x+w:x+w/2);
  var py=h.indexOf("n")>-1?y:(h.indexOf("s")>-1?y+hh:y+hh/2);
  return {x:px,y:py};
}
function retSel(){
  if(S.flut) return {x:S.flut.x,y:S.flut.y,w:S.flut.w,h:S.flut.h};
  return S.sel;
}
function renderOver(){
  var o=E.over, c=o.getContext("2d");
  c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,o.width,o.height);
  c.setTransform(S.dpr,0,0,S.dpr,0,0);
  guiasSim(c);
  guiasBal(c);
  var r=retSel();
  if(r&&r.w>0&&r.h>0){
    var x=S.tx+r.x*S.z, y=S.ty+r.y*S.z, w=r.w*S.z, h=r.h*S.z;
    c.lineWidth=1; c.setLineDash([]); c.strokeStyle="#fff"; c.strokeRect(x+0.5,y+0.5,w,h);
    c.setLineDash([5,4]); c.strokeStyle="#000"; c.strokeRect(x+0.5,y+0.5,w,h); c.setLineDash([]);
    if(S.flut||(!S.selOp||S.selOp.tipo!=="novo")){
      ALCAS.forEach(function(a){
        var p=posAlca(r,a); c.fillStyle="#fff"; c.strokeStyle="#000";
        c.fillRect(p.x-4,p.y-4,8,8); c.strokeRect(p.x-3.5,p.y-3.5,7,7);
      });
    }
  }
  var B=PINCEIS[S.ferr];
  if(B&&S.cursor&&!S.gesto&&!S.pan&&!S.espaco){
    var rr=Math.max(1.5,CFG.ajust[S.ferr].tam*S.z/2);
    c.beginPath(); c.arc(S.cursor.x,S.cursor.y,rr,0,TAU); c.lineWidth=1;
    c.strokeStyle="#fff"; c.stroke();
    c.beginPath(); c.arc(S.cursor.x,S.cursor.y,rr+1,0,TAU); c.strokeStyle="rgba(0,0,0,.7)"; c.stroke();
  }
}

/* ---------- histórico (desfazer / refazer) ---------- */
function bytesDe(e){
  if(e.t==="px") return e.antes.width*e.antes.height*8;
  if(e.t==="grupo") return e.itens.reduce(function(a,i){ return a+bytesDe(i); },0);
  return 0;
}
function empurrar(ent){
  S.hist.push(ent); S.refaz.length=0; S.tocou=true;
  S.bytes+=bytesDe(ent);
  while(S.hist.length>150||S.bytes>350e6){
    S.bytes-=bytesDe(S.hist.shift());
  }
  atualizarBotoesHist(); agendarSalvar();
}
function aplicar(e,lado){
  if(e.t==="px"){
    var L=porId(e.layer); if(!L) return;
    var img=e[lado];
    L.cx.clearRect(e.x,e.y,img.width,img.height); L.cx.drawImage(img,e.x,e.y); L.sujo=true;
  }else if(e.t==="prop"){
    var P=porId(e.id); if(!P) return;
    var v=e[lado]; for(var k in v) P[k]=v[k];
  }else if(e.t==="estrutura"){
    var st=e[lado]; S.camadas=st.lista.slice(); S.ativa=st.ativa;
    S.camadas.forEach(function(L){ L.sujo=true; });
  }else if(e.t==="bal"){
    S.baloes=e[lado].map(cloneBal);
    if(!S.baloes.some(function(b){ return b.id===S.balSel; })) S.balSel=null;
  }else if(e.t==="grupo"){
    var it=lado==="antes"?e.itens.slice().reverse():e.itens;
    it.forEach(function(i){ aplicar(i,lado); });
  }
}
function desfazer(){
  if(!S||S.carregando) return;
  if(S.flut) commitFlut();
  fecharEdicaoBal(); var e=S.hist.pop(); if(!e) return;
  aplicar(e,"antes"); S.refaz.push(e);
  depoisHist();
}
function refazer(){
  if(!S||S.carregando) return;
  fecharEdicaoBal(); var e=S.refaz.pop(); if(!e) return;
  aplicar(e,"depois"); S.hist.push(e);
  depoisHist();
}
function depoisHist(){
  S.sel=null; atualizarBotoesHist(); listaCamadas(); pedir(true); agendarSalvar(); atualizarBal();
}
function atualizarBotoesHist(){
  qa("[data-ed=desfazer]").forEach(function(b){ b.disabled=!S||!S.hist.length; });
  qa("[data-ed=refazer]").forEach(function(b){ b.disabled=!S||!S.refaz.length; });
}

/* ---------- pincéis ---------- */
function pressao(e){
  if(!CFG.pressao||e.pointerType!=="pen") return 1;
  return clamp(e.pressure||0.5,0.05,1);
}
function raio(vv,p){
  var r=vv.tam/2;
  if(vv.B.pres==="tam") r*=vv.B.min+(1-vv.B.min)*p;
  return Math.max(0.4,r);
}
function passo(vv,p){ return Math.max(0.5,vv.B.esp*2*raio(vv,p)); }
/* simetria: lista de matrizes [a,b,c,d,e,f] (a primeira é a identidade) */
function transfSim(){
  var m=CFG.sim, W=S.dim.w, H=S.dim.h, out=[[1,0,0,1,0,0]];
  if(m==="v"||m==="q") out.push([-1,0,0,1,W,0]);
  if(m==="h"||m==="q") out.push([1,0,0,-1,0,H]);
  if(m==="q") out.push([-1,0,0,-1,W,H]);
  if(m==="r"){
    var n=CFG.simN, cx=W/2, cy=H/2, k, a, co, si;
    for(k=1;k<n;k++){
      a=TAU*k/n; co=Math.cos(a); si=Math.sin(a);
      out.push([co,si,-si,co,cx-co*cx+si*cy,cy-si*cx-co*cy]);
    }
  }
  return out;
}
function carimbo(vv,x,y,p){
  if(vv.B.tipo==="esfumar"||!CFG.sim){ carimboUm(vv,x,y,p); return; }
  transfSim().forEach(function(m){
    carimboUm(vv,m[0]*x+m[2]*y+m[4],m[1]*x+m[3]*y+m[5],p);
  });
}
function carimboUm(vv,x,y,p){
  var B=vv.B, r=raio(vv,p), c=vv.cx, bb=vv.bb;
  if(x-r-2<bb.x0) bb.x0=x-r-2; if(y-r-2<bb.y0) bb.y0=y-r-2;
  if(x+r+2>bb.x1) bb.x1=x+r+2; if(y+r+2>bb.y1) bb.y1=y+r+2;
  if(B.tipo==="esfumar"){ esfumarUm(vv,x,y,r); return; }
  if(B.tipo==="lapis"){
    var sp=sprite("lapis",r,vv.cor,B.grao);
    c.globalAlpha=0.5*(B.pres==="op"?(0.35+0.65*p):1);
    c.drawImage(sp,x-sp.width/2+(Math.random()-0.5)*r*0.5,y-sp.height/2+(Math.random()-0.5)*r*0.5);
    c.globalAlpha=1;
  }else if(B.tipo==="macio"){
    var sm=sprite("macio",r,vv.cor);
    c.globalAlpha=(B.fluxo||0.22)*(0.4+0.6*p);
    c.drawImage(sm,x-sm.width/2,y-sm.height/2);
    c.globalAlpha=1;
  }else{
    c.fillStyle=vv.cor; c.beginPath(); c.arc(x,y,r,0,TAU); c.fill();
  }
}
/* esfumar: arrasta a cor que está sob o pincel, direto na camada */
function esfumarUm(vv,x,y,r){
  var L=vv.L, d=Math.round(r*2)+2, ri=Math.max(1,Math.round(r));
  var ox=Math.round(x-d/2), oy=Math.round(y-d/2);
  if(!vv.pick){
    vv.pick=novoCanvas(d,d); vv.pk=vv.pick.getContext("2d"); vv.tmpE=novoCanvas(d,d);
    vv.pk.drawImage(L.cv,ox,oy,d,d,0,0,d,d);
    return;
  }
  var t=vv.tmpE, tc=t.getContext("2d");
  tc.globalCompositeOperation="source-over"; tc.globalAlpha=1; tc.clearRect(0,0,d,d);
  tc.drawImage(vv.pick,0,0);
  tc.globalCompositeOperation="destination-in";
  tc.drawImage(sprite("macio",ri,"#000000")[0]||sprite("macio",ri,"#000000"),0,0,d,d);
  tc.globalCompositeOperation="source-over";
  L.cx.save(); L.cx.globalAlpha=Math.min(1,vv.op*0.6); L.cx.drawImage(t,ox,oy); L.cx.restore();
  vv.pk.globalAlpha=0.35; vv.pk.drawImage(L.cv,ox,oy,d,d,0,0,d,d); vv.pk.globalAlpha=1;
}
function segmento(vv,x1,y1,p1,x2,y2,p2){
  var d=Math.hypot(x2-x1,y2-y1); if(d<=0) return;
  var pos=vv.falta, f, p;
  while(pos<=d){
    f=pos/d; p=p1+(p2-p1)*f;
    carimbo(vv,x1+(x2-x1)*f,y1+(y2-y1)*f,p);
    pos+=passo(vv,p);
  }
  vv.falta=pos-d;
}
function kEstab(vv){ return 1/(1+vv.estab*0.9); }
function seguir(vv,k){
  var u=vv.ult, a=vv.alvo;
  var nx=u.x+(a.x-u.x)*k, ny=u.y+(a.y-u.y)*k, np=u.p+(a.p-u.p)*k;
  segmento(vv,u.x,u.y,u.p,nx,ny,np);
  vv.ult={x:nx,y:ny,p:np};
}
function addPonto(vv,x,y,p){
  vv.alvo={x:x,y:y,p:p};
  if(!vv.ult){
    carimbo(vv,x,y,p); vv.ult={x:x,y:y,p:p}; vv.falta=passo(vv,p); return;
  }
  seguir(vv,kEstab(vv));
}
function iniciarTraco(e,w){
  commitFlut();
  var L=camadaAtiva(); if(!L) return;
  if(!L.vis){ aviso("A camada está oculta. Mostre-a para desenhar."); return; }
  var B=PINCEIS[S.ferr], aj=CFG.ajust[S.ferr];
  var vv={B:B,L:L,cv:S.live,cx:S.live.getContext("2d"),borracha:!!B.borracha,op:aj.op/100,
    cor:B.borracha?"#000000":CFG.cor,tam:aj.tam,estab:aj.estab,ult:null,alvo:null,falta:0,
    bb:{x0:1e9,y0:1e9,x1:-1e9,y1:-1e9},id:e.pointerId};

function cancelarTraco(){

}
function clipBB(bb){
  var x0=Math.max(0,Math.floor(bb.x0)), y0=Math.max(0,Math.floor(bb.y0));
  var x1=Math.min(S.dim.w,Math.ceil(bb.x1)), y1=Math.min(S.dim.h,Math.ceil(bb.y1));
  if(x1<=x0||y1<=y0) return null;

}
function finalizarTraco(){
  var vv=S.vivo; if(!vv) return;

  }else{
    var g=0, k=Math.max(kEstab(vv),0.3);

    segmento(vv,vv.ult.x,vv.ult.y,vv.ult.p,vv.alvo.x,vv.alvo.y,vv.alvo.p);
    bb=clipBB(vv.bb);
  }
  S.vivo=null;
  var L=vv.L||camadaAtiva();
  if(vv.fb){
    if(!bb){ pedir(true); return; }
    var antesE=recortar(vv.fb,bb.x,bb.y,bb.w,bb.h), depoisE=recortar(L.cv,bb.x,bb.y,bb.w,bb.h);
    L.sujo=true;
    empurrar({t:"px",layer:L.id,x:bb.x,y:bb.y,antes:antesE,depois:depoisE});
    pedir(true); return;
  }
  if(!bb){ vv.cx.clearRect(0,0,S.dim.w,S.dim.h); pedir(true); return; }
  var antes=recortar(L.cv,bb.x,bb.y,bb.w,bb.h);
  L.cx.save();
  L.cx.globalAlpha=vv.op; L.cx.globalCompositeOperation=vv.borracha?"destination-out":"source-over";
  L.cx.drawImage(vv.cv,bb.x,bb.y,bb.w,bb.h,bb.x,bb.y,bb.w,bb.h);
  L.cx.restore();
  var depois=recortar(L.cv,bb.x,bb.y,bb.w,bb.h);
  L.sujo=true;
  empurrar({t:"px",layer:L.id,x:bb.x,y:bb.y,antes:antes,depois:depois});
  vv.cx.setTransform(1,0,0,1,0,0); vv.cx.clearRect(0,0,S.dim.w,S.dim.h);
  pedir(true);
}

/* ---------- formas: linha, retângulo, elipse ---------- */
function iniciarForma(e,w){

  var L=camadaAtiva(); if(!L) return;
  if(!L.vis){ aviso("A camada está oculta. Mostre-a para desenhar."); return; }
  var aj=CFG.ajust[S.ferr];
  var vv={forma:{tipo:S.ferr,x0:w.x,y0:w.y,x1:w.x,y1:w.y},L:L,cv:S.live,cx:S.live.getContext("2d"),
    borracha:false,op:aj.op/100,cor:CFG.cor,tam:aj.tam,fill:CFG.preencher,id:e.pointerId,bb:null};
  vv.cx.setTransform(1,0,0,1,0,0); vv.cx.clearRect(0,0,S.dim.w,S.dim.h);
  S.vivo=vv; redesenharForma(vv); pedir(true);
}
function ajustarForma(f,w,shift){
  var x=w.x, y=w.y, dx=x-f.x0, dy=y-f.y0;
  if(shift){
    if(f.tipo==="linha"){
      var ang=Math.atan2(dy,dx), len=Math.hypot(dx,dy), q=Math.round(ang/(Math.PI/4))*(Math.PI/4);
      dx=Math.cos(q)*len; dy=Math.sin(q)*len;
    }else{
      var m=Math.max(Math.abs(dx),Math.abs(dy));
      dx=(dx<0?-1:1)*m; dy=(dy<0?-1:1)*m;
    }
    x=f.x0+dx; y=f.y0+dy;
  }
  f.x1=x; f.y1=y;
}
function tracarForma(c,f,cor,lw,fill){
  c.save(); c.strokeStyle=cor; c.fillStyle=cor; c.lineWidth=lw; c.lineCap="round"; c.lineJoin="round";
  if(f.tipo==="linha"){
    c.beginPath(); c.moveTo(f.x0,f.y0); c.lineTo(f.x1,f.y1); c.stroke();
  }else if(f.tipo==="retangulo"){
    var rx=Math.min(f.x0,f.x1), ry=Math.min(f.y0,f.y1), rw=Math.abs(f.x1-f.x0), rh=Math.abs(f.y1-f.y0);
    if(fill) c.fillRect(rx,ry,rw,rh);
    c.strokeRect(rx,ry,rw,rh);
  }else{
    var cx=(f.x0+f.x1)/2, cy=(f.y0+f.y1)/2, a=Math.max(0.5,Math.abs(f.x1-f.x0)/2), b=Math.max(0.5,Math.abs(f.y1-f.y0)/2);
    c.beginPath(); c.ellipse(cx,cy,a,b,0,0,TAU);
    if(fill) c.fill();
    c.stroke();
  }
  c.restore();
}
function redesenharForma(vv){
  var c=vv.cx;
  c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,S.dim.w,S.dim.h);
  transfSim().forEach(function(m){
    c.save(); c.setTransform(m[0],m[1],m[2],m[3],m[4],m[5]);
    tracarForma(c,vv.forma,vv.cor,vv.tam,vv.fill);
    c.restore();
  });
}
function bbForma(vv){
  var f=vv.forma, pad=vv.tam+3;
  if(CFG.sim) return {x0:0,y0:0,x1:S.dim.w,y1:S.dim.h};
  return {x0:Math.min(f.x0,f.x1)-pad,y0:Math.min(f.y0,f.y1)-pad,x1:Math.max(f.x0,f.x1)+pad,y1:Math.max(f.y0,f.y1)+pad};
}

/* guias desenhadas por cima do palco */
function guiasSim(c){
  if(!CFG.sim) return;
  var W=S.dim.w*S.z, H=S.dim.h*S.z, x0=S.tx, y0=S.ty, cx=x0+W/2, cy=y0+H/2;
  c.save();
  c.beginPath(); c.rect(x0,y0,W,H); c.clip();
  c.lineWidth=1; c.setLineDash([6,5]); c.strokeStyle="rgba(42,111,219,.85)";
  c.beginPath();
  if(CFG.sim==="v"||CFG.sim==="q"){ c.moveTo(cx,y0); c.lineTo(cx,y0+H); }
  if(CFG.sim==="h"||CFG.sim==="q"){ c.moveTo(x0,cy); c.lineTo(x0+W,cy); }
  if(CFG.sim==="r"){
    var k, a, rr=Math.hypot(W,H)/2;
    for(k=0;k<CFG.simN;k++){ a=TAU*k/CFG.simN; c.moveTo(cx,cy); c.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr); }
  }
  c.stroke(); c.restore();
}
function guiasBal(c){
  if(S.ferr!=="balao") return;
  var b=balAtual(); if(!b) return;
  var x=S.tx+b.x*S.z, y=S.ty+b.y*S.z, w=b.w*S.z, h=b.h*S.z;
  c.save(); c.lineWidth=1; c.setLineDash([]); c.strokeStyle="#fff"; c.strokeRect(x+0.5,y+0.5,w,h);
  c.setLineDash([5,4]); c.strokeStyle="#000"; c.strokeRect(x+0.5,y+0.5,w,h); c.setLineDash([]);
  var r={x:b.x,y:b.y,w:b.w,h:b.h};
  ALCAS.forEach(function(a){
    var p=posAlca(r,a); c.fillStyle="#fff"; c.strokeStyle="#000";
    c.fillRect(p.x-4,p.y-4,8,8); c.strokeRect(p.x-3.5,p.y-3.5,7,7);
  });
  if(b.tipo!=="narracao"){
    var tx=S.tx+b.px*S.z, ty=S.ty+b.py*S.z;
    c.beginPath(); c.arc(tx,ty,7,0,TAU); c.fillStyle="#2a6fdb"; c.fill(); c.lineWidth=2; c.strokeStyle="#fff"; c.stroke();

function balEdit(fn){

function fecharEdicaoBal(){

}
function novoBalao(x,y,tipo,txt){
  var m=Math.min(S.dim.w,S.dim.h), t=tipo||CFG.balTipo, rect=ehRetBal(t);
  var w=Math.round(m*(rect?0.42:0.36)), h=Math.round(m*(rect?0.17:0.22));
  var bx=clamp(Math.round(x-w/2),0,Math.max(0,S.dim.w-w)), by=clamp(Math.round(y-h/2),0,Math.max(0,S.dim.h-h));
  var py=by+h+h*0.55; if(py>S.dim.h-4) py=by-h*0.55;
  var b=cloneBal({id:nid(),txt:txt||"",tipo:t,x:bx,y:by,w:w,h:h,px:bx+w*0.3,py:py,fs:0});
  var antes=snapBal();
  S.baloes.push(b); S.balSel=b.id;
  empurrar({t:"bal",antes:antes,depois:snapBal()});
  atualizarBal(); pedir(true);
  return b;
}
function novoBalaoCentro(){
  fecharEdicaoBal();
  novoBalao((S.pw/2-S.tx)/S.z,(S.ph/2-S.ty)/S.z,CFG.balTipo,"");
}
function balEm(x,y){
  for(var i=S.baloes.length-1;i>=0;i--){
    var b=S.baloes[i];
    if(x<b.x||x>b.x+b.w||y<b.y||y>b.y+b.h) continue;
    if(ehRetBal(b.tipo)) return b;
    var nx=(x-(b.x+b.w/2))/(b.w/2), ny=(y-(b.y+b.h/2))/(b.h/2);
    if(nx*nx+ny*ny<=1.15) return b;
  }
  return null;
}
function balAlca(b,sx,sy){
  var i, p;
  if(b.tipo!=="narracao"){
    p={x:S.tx+b.px*S.z,y:S.ty+b.py*S.z};
    if(Math.hypot(sx-p.x,sy-p.y)<=14) return "cauda";
  }
  var r={x:b.x,y:b.y,w:b.w,h:b.h};
  for(i=0;i<ALCAS.length;i++){
    p=posAlca(r,ALCAS[i]);
    if(Math.abs(sx-p.x)<=10&&Math.abs(sy-p.y)<=10) return ALCAS[i];
  }
  var x=S.tx+b.x*S.z, y=S.ty+b.y*S.z, w=b.w*S.z, h=b.h*S.z;
  if(sx>=x&&sx<=x+w&&sy>=y&&sy<=y+h) return "mover";
  return null;
}
function balDown(w,sx,sy){
  var b=balAtual(), h=b?balAlca(b,sx,sy):null;
  if(!(h&&h!=="mover")){
    var hit=balEm(w.x,w.y);
    if(hit){
      b=hit; h="mover";
      if(S.balSel!==b.id){ fecharEdicaoBal(); S.balSel=b.id; atualizarBal(); }
    }else{
      fecharEdicaoBal();
      novoBalao(w.x,w.y,CFG.balTipo,"");
      return;
    }
  }
  fecharEdicaoBal();
  S.balOp={h:h,x0:w.x,y0:w.y,ini:cloneBal(b),snap:snapBal(),moveu:false};
  pedir(false);
}
function balMove(w){
  var op=S.balOp, b=balAtual(); if(!op||!b) return;
  var dx=w.x-op.x0, dy=w.y-op.y0, i=op.ini, h=op.h;
  if(Math.abs(dx)+Math.abs(dy)>2) op.moveu=true;
  if(h==="mover"){ b.x=i.x+dx; b.y=i.y+dy; b.px=i.px+dx; b.py=i.py+dy; }
  else if(h==="cauda"){ b.px=i.px+dx; b.py=i.py+dy; }
  else{
    var nx=i.x, ny=i.y, nw=i.w, nh=i.h;
    if(h.indexOf("e")>-1) nw=i.w+dx;
    if(h.indexOf("w")>-1){ nw=i.w-dx; nx=i.x+dx; }
    if(h.indexOf("s")>-1) nh=i.h+dy;
    if(h.indexOf("n")>-1){ nh=i.h-dy; ny=i.y+dy; }
    if(nw<60){ if(h.indexOf("w")>-1) nx=i.x+i.w-60; nw=60; }
    if(nh<40){ if(h.indexOf("n")>-1) ny=i.y+i.h-40; nh=40; }
    b.x=nx; b.y=ny; b.w=nw; b.h=nh;
  }
  b._c=null; pedir(true);
}

/* ---------- balde e conta-gotas ---------- */
function balde(w){
  commitFlut();
  var L=camadaAtiva(); if(!L) return;
  if(!L.vis){ aviso("A camada está oculta. Mostre-a para pintar."); return; }
  var W=S.dim.w, H=S.dim.h, sx=Math.floor(w.x), sy=Math.floor(w.y);
  if(sx<0||sy<0||sx>=W||sy>=H) return;
  var ref;
  if(CFG.ref){
    ref=novoCanvas(W,H); var rc=ref.getContext("2d");
    rc.fillStyle="#fff"; rc.fillRect(0,0,W,H); camadasEm(rc,false);
  }else ref=L.cv;
  var dt=ref.getContext("2d").getImageData(0,0,W,H).data;
  var i0=(sy*W+sx)*4, r0=dt[i0], g0=dt[i0+1], b0=dt[i0+2], a0=dt[i0+3];
  var tol=CFG.tol*2.55;
  function casa(i){
    var j=i*4;
    return (Math.abs(dt[j]-r0)+Math.abs(dt[j+1]-g0)+Math.abs(dt[j+2]-b0)+Math.abs(dt[j+3]-a0))/4<=tol;
  }
  var mask=new Uint8Array(W*H), pilha=[sx,sy], minx=sx, maxx=sx, miny=sy, maxy=sy;
  while(pilha.length){
    var y=pilha.pop(), x=pilha.pop(), i=y*W+x;
    if(mask[i]||!casa(i)) continue;
    var xl=x, xr=x;
    while(xl>0&&!mask[y*W+xl-1]&&casa(y*W+xl-1)) xl--;
    while(xr<W-1&&!mask[y*W+xr+1]&&casa(y*W+xr+1)) xr++;
    var k;
    for(k=xl;k<=xr;k++) mask[y*W+k]=1;
    if(xl<minx) minx=xl; if(xr>maxx) maxx=xr; if(y<miny) miny=y; if(y>maxy) maxy=y;
    for(var dy=-1;dy<=1;dy+=2){
      var ny=y+dy; if(ny<0||ny>=H) continue;
      var preso=false;
      for(k=xl;k<=xr;k++){
        var ok=!mask[ny*W+k]&&casa(ny*W+k);
        if(ok&&!preso){ pilha.push(k,ny); preso=true; } else if(!ok) preso=false;
      }
    }
  }
  /* cresce 1 px para cobrir o serrilhado das linhas */
  var bx0=Math.max(0,minx-1), by0=Math.max(0,miny-1), bx1=Math.min(W-1,maxx+1), by1=Math.min(H-1,maxy+1);
  var bw=bx1-bx0+1, bh=by1-by0+1;
  var tc=novoCanvas(bw,bh), tcx=tc.getContext("2d"), id=tcx.createImageData(bw,bh), od=id.data, rgb=hexRgb(CFG.cor);
  var yy, xx;
  for(yy=by0;yy<=by1;yy++) for(xx=bx0;xx<=bx1;xx++){
    var q=yy*W+xx, m=mask[q];
    if(!m){

/* ---------- seleção, mover e redimensionar ---------- */
function levantar(){
  var L=camadaAtiva(), r=S.sel; if(!L||!r||r.w<1||r.h<1) return false;

  var fb=novoCanvas(S.dim.w,S.dim.h); fb.getContext("2d").drawImage(L.cv,0,0);
  var fc=recortar(L.cv,r.x,r.y,r.w,r.h);

  S.flut={cv:fc,ox:r.x,oy:r.y,ow:r.w,oh:r.h,x:r.x,y:r.y,w:r.w,h:r.h,fb:fb,layer:L.id,nova:false};
  S.sel=null; pedir(true); return true;
}
function uniao(a,b){
  var x0=b.x, y0=b.y, x1=b.x+b.w, y1=b.y+b.h;
  if(a){ x0=Math.min(x0,a.x); y0=Math.min(y0,a.y); x1=Math.max(x1,a.x+a.w); y1=Math.max(y1,a.y+a.h); }
  x0=Math.max(0,Math.floor(x0)); y0=Math.max(0,Math.floor(y0));
  x1=Math.min(S.dim.w,Math.ceil(x1)); y1=Math.min(S.dim.h,Math.ceil(y1));
  if(x1<=x0||y1<=y0) return null;

}
function commitFlut(){

  var igual=!f.nova&&!f.mod&&nx===f.ox&&ny===f.oy&&nw===f.ow&&nh===f.oh;
  var bb=uniao(f.nova?null:{x:f.ox,y:f.oy,w:f.ow,h:f.oh},{x:nx,y:ny,w:nw,h:nh});
  L.cx.save(); L.cx.imageSmoothingQuality="high";
  L.cx.drawImage(f.cv,0,0,f.ow,f.oh,nx,ny,nw,nh); L.cx.restore();
  if(!bb||igual){ S.sel=igual?{x:f.ox,y:f.oy,w:f.ow,h:f.oh}:null; pedir(true); return; }
  var antes=recortar(f.fb,bb.x,bb.y,bb.w,bb.h), depois=recortar(L.cv,bb.x,bb.y,bb.w,bb.h);
  L.sujo=true;
  empurrar({t:"px",layer:L.id,x:bb.x,y:bb.y,antes:antes,depois:depois});

}

}
function apagarSel(){

}
function selecionarTudo(){

}
function copiarSel(){

function colarSel(){

function alcaEm(r,sx,sy){

  }
  var x=S.tx+r.x*S.z, y=S.ty+r.y*S.z, w=r.w*S.z, h=r.h*S.z;
  if(sx>=x&&sx<=x+w&&sy>=y&&sy<=y+h) return "mover";

}
function selDown(w,sx,sy,e){
  var r=retSel();

      var f=S.flut;
      S.selOp={tipo:h==="mover"?"mover":"escala",h:h,x0:w.x,y0:w.y,r0:{x:f.x,y:f.y,w:f.w,h:f.h},shift:e.shiftKey};

function selMove(w){
  var op=S.selOp; if(!op) return;

    var x0=clamp(Math.min(op.x0,w.x),0,S.dim.w), y0=clamp(Math.min(op.y0,w.y),0,S.dim.h);
    var x1=clamp(Math.max(op.x0,w.x),0,S.dim.w), y1=clamp(Math.max(op.y0,w.y),0,S.dim.h);
    S.sel={x:Math.round(x0),y:Math.round(y0),w:Math.round(x1-x0),h:Math.round(y1-y0)};
  }else if(op.tipo==="mover"){
    S.flut.x=op.r0.x+(w.x-op.x0); S.flut.y=op.r0.y+(w.y-op.y0);
    pedir(true); return;
  }else{
    var r=op.r0, dx=w.x-op.x0, dy=w.y-op.y0, h=op.h;
    var nx=r.x, ny=r.y, nw=r.w, nh=r.h;
    if(h.indexOf("e")>-1) nw=r.w+dx;
    if(h.indexOf("w")>-1){ nw=r.w-dx; nx=r.x+dx; }
    if(h.indexOf("s")>-1) nh=r.h+dy;
    if(h.indexOf("n")>-1){ nh=r.h-dy; ny=r.y+dy; }
    if(h.length===2&&!op.shift){
      var sc=Math.max(Math.abs(nw/r.w),Math.abs(nh/r.h));
      nw=r.w*sc; nh=r.h*sc;
      nx=h.indexOf("w")>-1?r.x+r.w-nw:r.x; ny=h.indexOf("n")>-1?r.y+r.h-nh:r.y;
    }
    if(nw<4){ if(h.indexOf("w")>-1) nx=r.x+r.w-4; nw=4; }
    if(nh<4){ if(h.indexOf("n")>-1) ny=r.y+r.h-4; nh=4; }
    S.flut.x=nx; S.flut.y=ny; S.flut.w=nw; S.flut.h=nh;

  }

}

/* ---------- ponteiro: desenhar, mover a tela, zoom ---------- */
function ptoPalco(e){
  var rc=E.palco.getBoundingClientRect();
  return {x:e.clientX-rc.left,y:e.clientY-rc.top};
}
function paraObra(sx,sy){ return {x:(sx-S.tx)/S.z,y:(sy-S.ty)/S.z}; }
function onDown(e){
  if(!S||S.carregando) return;
  var p=ptoPalco(e);
  E.over.setPointerCapture(e.pointerId);
  S.ptrs[e.pointerId]={x:p.x,y:p.y}; S.nptr=Object.keys(S.ptrs).length;
  if(S.nptr===2){ iniciarGesto(); cancelarTraco(); S.selOp=null; S.balOp=null; return; }
  if(S.nptr>2) return;
  if(e.pointerType==="mouse"&&e.button>1) return;
  if((e.pointerType==="mouse"&&e.button===1)||S.espaco||S.ferr==="mao"){
    S.pan={x:p.x,y:p.y,tx:S.tx,ty:S.ty}; E.over.style.cursor="grabbing"; return;
  }
  var w=paraObra(p.x,p.y);
  if(PINCEIS[S.ferr]) iniciarTraco(e,w);
  else if(FORMAS[S.ferr]) iniciarForma(e,w);
  else if(S.ferr==="balao") balDown(w,p.x,p.y);
  else if(S.ferr==="balde") balde(w);
  else if(S.ferr==="gota") gota(w);
  else if(S.ferr==="selecionar") selDown(w,p.x,p.y,e);
}
function onMove(e){
  if(!S) return;
  var p=ptoPalco(e);
  S.cursor=p;
  E.coord.textContent=Math.round((p.x-S.tx)/S.z)+", "+Math.round((p.y-S.ty)/S.z)+" px";
  if(S.ptrs[e.pointerId]){ S.ptrs[e.pointerId]={x:p.x,y:p.y}; }
  if(S.gesto){ atualizarGesto(); return; }
  if(S.pan){
    S.tx=S.pan.tx+(p.x-S.pan.x); S.ty=S.pan.ty+(p.y-S.pan.y); S.ajustado=false; pedir(true); return;
  }
  if(S.vivo&&e.pointerId===S.vivo.id){
    if(S.vivo.forma){ ajustarForma(S.vivo.forma,paraObra(p.x,p.y),e.shiftKey); redesenharForma(S.vivo); pedir(true); return; }
    var evs=e.getCoalescedEvents?e.getCoalescedEvents():[];
    if(!evs.length) evs=[e];
    for(var i=0;i<evs.length;i++){
      var q=ptoPalco(evs[i]), w=paraObra(q.x,q.y);
      addPonto(S.vivo,w.x,w.y,pressao(evs[i]));
    }
    pedir(true); return;
  }
  if(S.balOp){ balMove(paraObra(p.x,p.y)); return; }
  if(S.selOp){ selMove(paraObra(p.x,p.y)); return; }
  pedir(false);
}
function onUp(e){
  if(!S) return;
  delete S.ptrs[e.pointerId]; S.nptr=Object.keys(S.ptrs).length;
  if(S.gesto){ if(S.nptr<2) S.gesto=null; return; }
  if(S.pan){ S.pan=null; E.over.style.cursor=S.espaco||S.ferr==="mao"?"grab":"crosshair"; return; }
  if(S.vivo&&e.pointerId===S.vivo.id){ finalizarTraco(); return; }
  if(S.balOp){ balUp(); return; }
  if(S.selOp){ selUp(); return; }
}
function iniciarGesto(){
  var ids=Object.keys(S.ptrs), a=S.ptrs[ids[0]], b=S.ptrs[ids[1]];
  S.gesto={d0:Math.hypot(b.x-a.x,b.y-a.y)||1,cx0:(a.x+b.x)/2,cy0:(a.y+b.y)/2,z0:S.z,tx0:S.tx,ty0:S.ty};
  S.pan=null;
}
function atualizarGesto(){
  var g=S.gesto, ids=Object.keys(S.ptrs); if(ids.length<2) return;
  var a=S.ptrs[ids[0]], b=S.ptrs[ids[1]];
  var d=Math.hypot(b.x-a.x,b.y-a.y)||1, cx=(a.x+b.x)/2, cy=(a.y+b.y)/2;
  var nz=clamp(g.z0*d/g.d0,0.05,16), wx=(g.cx0-g.tx0)/g.z0, wy=(g.cy0-g.ty0)/g.z0;
  S.z=nz; S.tx=cx-wx*nz; S.ty=cy-wy*nz; S.ajustado=false;
  atualizarZoom(); pedir(true);
}
function onWheel(e){
  if(!S) return;
  e.preventDefault();
  var p=ptoPalco(e);
  if(e.ctrlKey||e.metaKey) zoomEm(Math.exp(-clamp(e.deltaY,-120,120)*0.0025),p.x,p.y);
  else{ S.tx-=e.deltaX; S.ty-=e.deltaY; S.ajustado=false; pedir(true); }
}

/* ---------- ferramentas e interface lateral ---------- */
function trocarFerr(n){
  if(!S) return;

  if(S.ferr==="balao"&&n!=="balao"){ fecharEdicaoBal(); S.balSel=null; S.balOp=null; }
  if(n==="gota"&&S.ferr!=="gota") S.ferrAnt=S.ferr;

/* painel pronto (camadas + balões) como canvas; usado nas prévias e nas exportações */
function compor(id,painel,maxLado,comBorda){
  return bdLer(id).then(function(rec){
    if(!rec||!rec.camadas||!rec.camadas.length) return null;
    var chave=TAMANHOS[painel&&painel.tamanho]?painel.tamanho:PADRAO_TAM, dim=dimensoes(chave);
    var k=Math.min(1,maxLado/Math.max(dim.w,dim.h));
    var ox=Math.round((dim.w-(rec.w||dim.w))/2), oy=Math.round((dim.h-(rec.h||dim.h))/2);
    return Promise.all(rec.camadas.map(function(c){ return decodificar(c.blob); })).then(function(imgs){
      var cv=novoCanvas(Math.max(1,Math.round(dim.w*k)),Math.max(1,Math.round(dim.h*k))), x=cv.getContext("2d");
      x.fillStyle="#fff"; x.fillRect(0,0,cv.width,cv.height);
      x.save(); x.scale(k,k); x.imageSmoothingQuality="high";
      rec.camadas.forEach(function(c,i){
        if(c.vis===false||!imgs[i]) return;
        x.globalAlpha=(c.op==null?100:c.op)/100; x.globalCompositeOperation=opComp(c.modo);
        x.drawImage(imgs[i],ox,oy);
      });
      x.globalAlpha=1; x.globalCompositeOperation="source-over";
      var b=painel&&typeof painel.borda==="number"?painel.borda:BORDA_PADRAO;
      if(comBorda&&b>0){ x.strokeStyle="#111"; x.lineWidth=b; x.strokeRect(b/2,b/2,dim.w-b,dim.h-b); }
      desenharBaloes(x,(rec.baloes||[]).map(function(bl){
        var q=cloneBal(bl); q.x+=ox; q.y+=oy; q.px+=ox; q.py+=oy; return q;
      }),Math.max(dim.w,dim.h));
      x.restore();
      return cv;
    });
  }).catch(function(){ return null; });
}

function obraObjAtual(){
  return obras.filter(function(o){return o.id===obraAtual;})[0]||null;
}

function marcarSujo(){
  sujo=true; estado.textContent="não salvo";
  clearTimeout(pendente);
  pendente=setTimeout(salvar,700);
}

async function salvar(){
  if(!db||!doc||salvando) return;
  salvando=true; estado.textContent="salvando…";
  try{
    doc.atualizadoEm=Date.now();
    var corpo=JSON.parse(JSON.stringify(doc));
    delete corpo.id;
    await colCaps().doc(doc.id).set(corpo);
    sujo=false; estado.textContent="salvo";
    var c=caps.filter(function(x){return x.id===doc.id;})[0];
    if(c){ c.titulo=doc.titulo; c.numero=doc.numero; c.nPaineis=contarPaineis(doc.paginas); c.atualizadoEm=doc.atualizadoEm; }
    desenharLateral();
  }catch(e){
    estado.textContent="erro ao salvar";
    aviso(e&&e.code==="quota_exceeded"
      ? "Espaço cheio. Apague um capítulo antigo para continuar."
      : "Não foi possível salvar. As mudanças seguem na tela — tente de novo em instantes.");
  }
  salvando=false;
  if(sujo){ clearTimeout(pendente); pendente=setTimeout(salvar,900); }
}

/* ========== lateral ========== */
function desenharLateral(){
  var lo=el("listaObras");
  if(!obras.length){
    lo.innerHTML='<p class="vazio-lateral">Nenhuma obra ainda. Crie a primeira para começar.</p>';
  }else{
    lo.innerHTML=obras.map(function(o){
      var n=caps.filter(function(c){return c.obraId===o.id;}).length;
      return '<div class="obra-item-wrap">'+
        '<button class="item" data-obra="'+o.id+'" aria-current="'+(obraAtual===o.id)+'">'+
          '<span class="rotulo">'+esc(o.titulo||"Sem título")+'</span>'+
          '<span class="contagem">'+n+' cap.</span>'+
        '</button>'+
        '<button type="button" class="bt-texto acao-obra" data-acao="rename-obra" data-obra-id="'+o.id+'" title="Renomear obra" aria-label="Renomear obra">renomear</button>'+
        '<button type="button" class="bt-texto risco acao-obra" data-acao="del-obra" data-obra-id="'+o.id+'" title="Apagar obra" aria-label="Apagar obra">apagar</button>'+
      '</div>';
    }).join("");
  }
  var bloco=el("blocoCapitulos"), lc=el("listaCaps");
  if(!obraAtual){ bloco.classList.add("oculto"); }
  else{
    bloco.classList.remove("oculto");
    var meus=caps.filter(function(c){return c.obraId===obraAtual;});
    lc.innerHTML = meus.length ? meus.map(function(c){
      return '<button class="item cap" data-cap="'+c.id+'" aria-current="'+(capAtual===c.id)+'">'+
        '<span class="rotulo">'+esc((c.numero?("#"+c.numero+" "):"")+(c.titulo||"Sem título"))+'</span>'+
        '<span class="contagem">'+c.nPaineis+'</span></button>';
    }).join("") : '<p class="vazio-lateral">Sem capítulos nesta obra.</p>';
  }
  var blocoP=el("blocoPersonagens"), lp=el("listaPersonagens");
  if(!obraAtual){ blocoP.classList.add("oculto"); }
  else{
    blocoP.classList.remove("oculto");
    var o=obraObjAtual();
    var pers=(o&&o.personagens)||[];
    lp.innerHTML = pers.length ? pers.map(function(n){
      return '<div class="personagem-item"><span class="rotulo">'+esc(n)+'</span>'+
        '<button class="bt-texto risco" data-acao="del-personagem" data-nome="'+esc(n)+'">remover</button></div>';
    }).join("") : '<p class="vazio-lateral">Nenhum personagem cadastrado.</p>';
  }
}

/* ========== criação ========== */
function abrirFormObra(){
  el("formObra").classList.remove("oculto");
  el("campoObra").value="";
  el("campoObra").focus();
}
function fecharFormObra(){
  el("formObra").classList.add("oculto");
}

async function criarObra(t){
  t=(t||"").trim(); if(!t) return;
  if(!db){ aviso("Sem armazenamento disponível nesta visualização."); return; }
  var o={titulo:t,criadoEm:Date.now(),personagens:[]};
  var ref=colObras().doc(id("o"));
  try{ await ref.set(o); }catch(e){ aviso("Não deu para criar a obra. Tente de novo."); return; }
  o.id=ref.path.split("/").pop(); obras.push(o);
  obraAtual=o.id; capAtual=null; doc=null;
  desenharLateral(); desenhar();
  criarCapitulo();
}

async function renomearObra(obraId){
  if(!db||!obraId) return;
  var alvo=obras.filter(function(o){return o.id===obraId;})[0];
  if(!alvo) return;
  var novo=window.prompt("Novo nome da obra:", alvo.titulo||"");
  if(novo===null) return;
  novo=novo.trim();
  if(!novo){ aviso("O nome da obra não pode ficar vazio."); return; }
  if(novo===alvo.titulo) return;
  var anterior=alvo.titulo;
  try{ await colObras().doc(obraId).update({titulo:novo}); }
  catch(e){ aviso("Não foi possível renomear a obra. Tente novamente."); return; }
  alvo.titulo=novo;
  desenharLateral();
  if(doc && obraAtual===obraId) desenhar();
  aviso("Obra renomeada.");
}

async function apagarObra(obraId){
  if(!db||!obraId) return;
  var alvo=obras.filter(function(o){return o.id===obraId;})[0];
  if(!alvo) return;
  var capsDaObra=caps.filter(function(c){return c.obraId===obraId;});
  try{
    for(var i=0;i<capsDaObra.length;i++){
      try{
        var snCap=await colCaps().doc(capsDaObra[i].id).get();
        if(snCap.exists) apagarDesenhosDe(snCap.data().paginas);
      }catch(e2){}
      await colCaps().doc(capsDaObra[i].id).delete();
    }
    await colObras().doc(obraId).delete();
  }catch(e){
    aviso("Não foi possível apagar a obra. Tente novamente.");
    return;
  }
  obras=obras.filter(function(o){return o.id!==obraId;});
  caps=caps.filter(function(c){return c.obraId!==obraId;});
  if(obraAtual===obraId){ obraAtual=null; capAtual=null; doc=null; }
  desenharLateral();
  desenhar();
  alternarLateral(false);
  aviso("Obra apagada.");
}

async function adicionarPersonagem(nome){
  nome=(nome||"").trim(); if(!nome) return;
  var o=obraObjAtual(); if(!o){ aviso("Selecione uma obra primeiro."); return; }
  o.personagens=o.personagens||[];
  if(o.personagens.indexOf(nome)>-1){ aviso("Esse personagem já existe."); return; }
  o.personagens.push(nome);
  try{ await colObras().doc(o.id).update({personagens:o.personagens}); }
  catch(e){ o.personagens.pop(); aviso("Não foi possível salvar o personagem."); return; }
  desenharLateral(); desenhar(); atualizarPersonagens();
}

async function removerPersonagem(nome){
  var o=obraObjAtual(); if(!o) return;
  var anterior=o.personagens||[];
  o.personagens=anterior.filter(function(n){return n!==nome;});
  try{ await colObras().doc(o.id).update({personagens:o.personagens}); }
  catch(e){ o.personagens=anterior; aviso("Não foi possível remover o personagem."); return; }
  desenharLateral(); desenhar(); atualizarPersonagens();
}

async function criarCapitulo(){
  if(!obraAtual||!db) return;
  var meus=caps.filter(function(c){return c.obraId===obraAtual;});
  var novo={
    obraId:obraAtual, numero:meus.length+1, titulo:"",
    paginas:[novaPagina()], atualizadoEm:Date.now()
  };
  var ref=colCaps().doc(id("c"));
  try{ await ref.set(novo); }catch(e){ aviso("Não deu para criar o capítulo. Tente de novo."); return; }
  novo.id=ref.path.split("/").pop();
  caps.push({id:novo.id,obraId:obraAtual,numero:novo.numero,titulo:"",nPaineis:1,atualizadoEm:novo.atualizadoEm});
  doc=novo; capAtual=novo.id;
  desenharLateral(); desenhar();
}

function novoPainel(){
  return {
    id:id("p"), enquadramento:"", distancia:"", plano:"", angulo:"", tamanho:"",
    personagens:[], acao:"", falas:[{quem:"",tipo:"fala",texto:""}], sfx:"", nota:""
  };
}
function duplicarPainel(pn){
  var c={
    id:id("p"), enquadramento:pn.enquadramento||pn.tipoPainel||"", distancia:pn.distancia||"",
    plano:pn.plano||"", angulo:pn.angulo||"", tamanho:pn.tamanho||"", personagens:(pn.personagens||[]).slice(),
    acao:pn.acao||"",
    falas:(pn.falas||[]).map(function(f){return {quem:f.quem||"",tipo:f.tipo||"fala",texto:f.texto||""};}),
    sfx:pn.sfx||"", nota:pn.nota||""
  };
  if(typeof pn.borda==="number") c.borda=pn.borda;
  if(pn.recolhido) c.recolhido=true;
  if(pn.temDesenho){
    c.temDesenho=true; c.miniatura=pn.miniatura;
    window.EditorDesenho.copiar(pn.id,c.id);   /* copia também o desenho guardado */
  }
  return c;
}
/* remove do navegador os desenhos dos painéis apagados */
function apagarDesenhosDe(paginas){
  (paginas||[]).forEach(function(pg){
    (pg.paineis||[]).forEach(function(pn){ window.EditorDesenho.apagar(pn.id); });
  });
}
function duplicarPagina(pg){
  var c={id:id("pg"),paineis:(pg.paineis||[]).map(duplicarPainel)};
  if(pg.visual) c.visual=JSON.parse(JSON.stringify(pg.visual));
  return c;
}
function resumoPainel(pn){
  var t=(pn.acao||"").trim();
  if(!t && pn.falas && pn.falas.length) t=(pn.falas[0].texto||"").trim();
  if(!t) return "(painel vazio)";
  return t.length>36 ? t.slice(0,36)+"…" : t;
}
function novaPagina(qtd){
  var n=qtd||1, paineis=[], i;
  for(i=0;i<n;i++) paineis.push(novoPainel());
  return {id:id("pg"),paineis:paineis};
}

/* Constrói a frase-resumo de um painel a partir das escolhas feitas nele. */
function fraseResumoPainel(pn){
  var pessoas=(pn.personagens||[]).filter(Boolean);
  var descricao=[];
  if(pn.plano) descricao.push(pn.plano.toLowerCase());
  if(pn.angulo) descricao.push(pn.angulo.toLowerCase());
  if(pn.distancia) descricao.push(pn.distancia.toLowerCase());
  if(pn.enquadramento) descricao.push(pn.enquadramento.toLowerCase());
  if(pn.tamanho&&TAMANHOS[pn.tamanho]) descricao.push("painel "+nomeTamanho(pn.tamanho).toLowerCase());

  var partes=[];
  if(pessoas.length) partes.push(pessoas.join(" e "));
  if(descricao.length) partes.push(descricao.join(", "));
  var abertura=partes.join(" — ");
  if(!abertura && pn.acao) abertura=pn.acao.trim().slice(0,60);

  var falantes=(pn.falas||[]).filter(function(f){return f.texto && f.texto.trim();}).map(function(f){
    var nome=(f.quem&&f.quem.trim())?f.quem.trim():"Alguém";
    var t=f.texto.trim();
    return nome+' diz: "'+(t.length>40?t.slice(0,40)+"…":t)+'"';
  });

  var s=abertura;
  if(falantes.length) s=(s?s+". ":"")+falantes.join("; ");
  if(pn.sfx && pn.sfx.trim()) s=(s?s+" ":"")+"["+pn.sfx.trim()+"]";
  return s || "Painel em branco — escolha um enquadramento ou escreva a cena.";
}

/* Converte o antigo campo único de enquadramento, sem perder roteiros já salvos. */
function normalizarPainel(pn){
  if(!pn) return;
  pn.enquadramento=pn.enquadramento||pn.tipoPainel||"";
  pn.distancia=pn.distancia||"";
  pn.plano=pn.plano||"";
  pn.angulo=pn.angulo||"";
  pn.tamanho=TAMANHOS[pn.tamanho]?pn.tamanho:"";
  pn.personagens=pn.personagens||[];
  pn.nota=pn.nota||"";
  pn.falas=pn.falas||[];
  if(!pn.falas.length) pn.falas.push({quem:"",tipo:"fala",texto:""});
  pn.falas.forEach(function(f){ f.quem=f.quem||""; f.tipo=f.tipo||"fala"; f.texto=f.texto||""; });
  var antigo=pn.enq||"";
  if(!antigo) return;
  if(!pn.plano && PLANOS.indexOf(antigo)>-1) pn.plano=antigo;
  else if(!pn.angulo && ANGULOS_CAMERA.indexOf(antigo)>-1) pn.angulo=antigo;
  else if(!pn.enquadramento && ENQUADRAMENTOS.indexOf(antigo)>-1) pn.enquadramento=antigo;
}
function normalizarDocumento(d){
  (d.paginas||[]).forEach(function(pg){
    (pg.paineis||[]).forEach(normalizarPainel);
  });
}

async function abrirCapitulo(cid){
  if(sujo){ clearTimeout(pendente); await salvar(); }
  try{
    var s=await colCaps().doc(cid).get();
    if(!s.exists){ aviso("Capítulo não encontrado."); return; }
    doc=s.data(); doc.id=cid; capAtual=cid; obraAtual=doc.obraId;
    if(!doc.paginas||!doc.paginas.length) doc.paginas=[novaPagina()];
    normalizarDocumento(doc);
    visHist={}; visAberto={};
    estado.textContent="salvo";
    desenharLateral(); desenhar(); atualizarPersonagens();
    alternarLateral(false);
    el("tela").scrollTop=0;
  }catch(e){ aviso("Não foi possível abrir o capítulo."); }
}

/* ========== desenho do roteiro ========== */
function desenhar(){
  el("tituloCap").disabled=!doc;
  el("btExportar").disabled=!doc;
  el("tituloCap").value=doc?(doc.titulo||""):"";

  if(!doc){
    if(!obras.length){
      /* tela 1: crie sua obra e já caia direto na criação */
      tela.innerHTML=
        '<div class="centro">'+
        '<h2>Crie sua obra</h2>'+
        '<p>Dê um nome e comece a escrever. Cada obra guarda seus capítulos e personagens; cada capítulo se divide em páginas, e cada página em painéis, que você também pode desenhar. Tudo é salvo sozinho.</p>'+
        '<form id="formBoasVindas" class="form-obra" autocomplete="off">'+
          '<input type="text" id="campoBoasVindas" placeholder="Nome da obra" maxlength="120" aria-label="Nome da obra">'+
          '<button type="submit" class="bt forte">Criar e começar</button>'+
        '</form>'+
        '</div>';
      el("formBoasVindas").addEventListener("submit",function(ev){
        ev.preventDefault();
        var t=el("campoBoasVindas").value;
        if(!t.trim()){ el("campoBoasVindas").focus(); return; }
        criarObra(t);
      });
      return;
    }
    tela.innerHTML=
      '<div class="centro">'+
      '<h2>Escolha um capítulo</h2>'+
      '<p>Selecione um capítulo na lista ao lado, ou crie um novo.</p>'+
      '<button class="bt forte" id="comecar">Novo capítulo</button>'+
      '</div>';
    var b=el("comecar");
    if(b) b.onclick=criarCapitulo;
    return;
  }

  var total=contarPaineis(doc.paginas);
  var html='<div class="folha">';
  doc.paginas.forEach(function(pg,ip){
    var np=(pg.paineis||[]).length;
    var denso=np>8;
    html+='<section class="pagina" data-pg="'+pg.id+'">'+
      '<div class="cabeca-pagina">'+
        '<h2>Página '+(ip+1)+'</h2>'+
        '<span class="info'+(denso?" aviso-densidade":"")+'">'+np+(np===1?" painel":" painéis")+
          (denso?" — bem cheia para uma página":"")+'</span>'+
        '<button class="bt-texto" data-acao="add-painel" data-pg="'+pg.id+'">+ painel</button>'+
        (np>0?'<button class="bt-texto" data-acao="duplicar-pagina" data-pg="'+pg.id+'">duplicar página</button>':'')+
        (doc.paginas.length>1?'<button class="bt-texto" data-acao="del-pagina" data-pg="'+pg.id+'">apagar página</button>':'')+
      '</div>';
    html+='<details class="detalhes visual-pg" data-vis-pg="'+pg.id+'"'+(visAberto[pg.id]?" open":"")+'>'+
      '<summary>Layout visual da página (frame de mangá para desenhar)</summary>'+
      '<div data-vis-host></div></details>';
    (pg.paineis||[]).forEach(function(pn,i){ html+=htmlPainel(pn,i,ip,np); });
    html+='</section>';
  });
  html+='<button class="add-pagina" data-acao="add-pagina">+ Nova página</button>';
  html+='<p style="color:var(--fraco);font-size:12.5px;margin-top:14px">'+
        doc.paginas.length+(doc.paginas.length===1?" página":" páginas")+" · "+
        total+(total===1?" painel":" painéis")+'</p>';
  html+='</div>';
  tela.innerHTML=html;
  montarVisuais();
  carregarPrevias();
}

/* prévia grande do desenho: fica guardada no navegador; enquanto carrega, vale a miniatura pequena */
var previas={};
function carregarPrevias(){
  Array.prototype.forEach.call(tela.querySelectorAll("img[data-prev]"),function(img){
    var pid=img.getAttribute("data-prev");
    if(previas[pid]){ img.src=previas[pid]; return; }
    if(!window.EditorDesenho.previa) return;
    window.EditorDesenho.previa(pid,acharPainelPorId(pid)).then(function(b){
      if(!b) return;
      var u=URL.createObjectURL(b);
      if(previas[pid]) URL.revokeObjectURL(previas[pid]);
      previas[pid]=u;
      if(img.isConnected) img.src=u;
    });
  });
}
function soltarPrevia(pid){
  if(previas[pid]){ URL.revokeObjectURL(previas[pid]); delete previas[pid]; }
}

function opcoesSelect(opcoes, valor, vazio){
  return opcoes.map(function(opcao){
    return '<option value="'+esc(opcao)+'"'+(valor===opcao?" selected":"")+'>'+
      (opcao||vazio)+'</option>';
  }).join("");
}

/* ========== layout visual: frames de mangá para redimensionar e desenhar ========== */
/* Cada página pode ter um layout visual (pg.visual), salvo junto com o capítulo:
   pg.visual = { ativo:"A", dados:{ A:{ r:[razões das divisões], s:{ idxQuadro:[traços] } } } }
   Os desenhos de cada layout ficam guardados separadamente (trocar de layout não apaga nada). */
var vF=function(){return {leaf:true};};
var vS=function(dir,ratio,a,b){return {dir:dir,ratio:ratio,a:a,b:b};};
/* dir "v" = divide lado a lado; dir "h" = divide em cima/embaixo. Para criar outro layout, copie uma linha. */
var LAYOUTS_VISUAIS={
  A:{nome:"A · 6 quadros",build:function(){
    return vS("h",0.54,
      vS("v",0.6,vS("h",0.5,vF(),vF()),vF()),
      vS("v",0.4,vF(),vS("h",0.5,vF(),vF())));}},
  B:{nome:"B · 6 quadros",build:function(){
    return vS("h",0.55,
      vS("h",0.5,vS("v",0.27,vF(),vF()),vS("v",0.7,vF(),vF())),
      vS("v",0.3,vF(),vF()));}},
  C:{nome:"C · 3 tiras",build:function(){return vS("h",0.34,vF(),vS("h",0.5,vF(),vF()));}},
  D:{nome:"D · grade 2×2",build:function(){return vS("h",0.5,vS("v",0.5,vF(),vF()),vS("v",0.5,vF(),vF()));}},
  E:{nome:"E · 1 grande + 2",build:function(){return vS("h",0.6,vF(),vS("v",0.5,vF(),vF()));}},
  F:{nome:"F · página cheia",build:function(){return vF();}}
};
var LAYOUT_PADRAO="A";
var vFerr={t:"p",c:"#111111",w:3};   /* ferramenta atual: lápis/borracha, cor, espessura */
var visAberto={}, visHist={};

function vDpr(){ return window.devicePixelRatio||1; }

function vDesenharTraco(ctx,s,cw,ch,esc){
  var pts=s.p, i; if(!pts||!pts.length) return;
  ctx.save();
  ctx.globalCompositeOperation=s.t==="e"?"destination-out":"source-over";
  ctx.strokeStyle=s.c; ctx.fillStyle=s.c;
  ctx.lineWidth=s.w*(esc||vDpr());
  ctx.lineCap="round"; ctx.lineJoin="round";
  if(pts.length===1){
    ctx.beginPath(); ctx.arc(pts[0][0]*cw,pts[0][1]*ch,ctx.lineWidth/2,0,Math.PI*2); ctx.fill();
  }else{
    ctx.beginPath(); ctx.moveTo(pts[0][0]*cw,pts[0][1]*ch);
    for(i=1;i<pts.length;i++) ctx.lineTo(pts[i][0]*cw,pts[i][1]*ch);
    ctx.stroke();
  }
  ctx.restore();
}

/* mantém lápis/borracha, cor e espessura iguais em todas as páginas abertas */
function vSincronizarBarras(){
  var i, a=tela.querySelectorAll('[data-v="lapis"]'), b=tela.querySelectorAll('[data-v="borracha"]'),
      c=tela.querySelectorAll('[data-v="cor"]'), w=tela.querySelectorAll('[data-v="tam"]');
  for(i=0;i<a.length;i++) a[i].classList.toggle("forte",vFerr.t==="p");
  for(i=0;i<b.length;i++) b[i].classList.toggle("forte",vFerr.t==="e");
  for(i=0;i<c.length;i++) c[i].value=vFerr.c;
  for(i=0;i<w.length;i++) w[i].value=vFerr.w;
}

/* ---------- exportação: página composta e PDF do capítulo ---------- */
function novoCanvas(w,h){ var c=document.createElement("canvas"); c.width=w; c.height=h; return c; }
var PAG_REF=460;     /* largura de referência da página na tela (px), usada para escalar bordas e traços */

/* retângulos dos quadros da página (frações 0–1), na mesma ordem usada na tela */
function retsPagina(pg){
  var v=pg.visual||{}, key=LAYOUTS_VISUAIS[v.ativo]?v.ativo:LAYOUT_PADRAO;
  var dados=(v.dados&&v.dados[key])||{r:[],s:{}};
  var tree=LAYOUTS_VISUAIS[key].build(), splits=[], leaves=[];
  (function varrer(n){
    if(n.leaf){ n.idx=leaves.length; leaves.push(n); }
    else{ splits.push(n); varrer(n.a); varrer(n.b); }
  })(tree);
  if(dados.r&&dados.r.length===splits.length) splits.forEach(function(sp,i){ sp.ratio=dados.r[i]; });
  (function pos(n,x,y,w,h){
    n.rect={x:x,y:y,w:w,h:h};
    if(n.leaf) return;
    if(n.dir==="v"){ var w1=w*n.ratio; pos(n.a,x,y,w1,h); pos(n.b,x+w1,y,w-w1,h); }
    else{ var h1=h*n.ratio; pos(n.a,x,y,w,h1); pos(n.b,x,y+h1,w,h-h1); }
  })(tree,0,0,1,1);
  return {leaves:leaves,tracos:dados.s||{}};
}

/* página inteira: quadros do layout + desenho de cada painel + balões + rabiscos do layout */
async function compPagina(pg,W){
  try{ if(document.fonts&&document.fonts.load) await document.fonts.load('700 24px "Comic Neue"'); }catch(e){}
  var H=Math.round(W*7/5), k=W/PAG_REF, ins=5*k, bw=2*k;
  var out=novoCanvas(W,H), cx=out.getContext("2d");
  cx.fillStyle="#fff"; cx.fillRect(0,0,W,H);
  var lay=retsPagina(pg), i, f, leaf, pn;
  for(i=0;i<lay.leaves.length;i++){
    leaf=lay.leaves[i]; f=leaf.rect;
    var fx=f.x*W+ins, fy=f.y*H+ins, fw=f.w*W-2*ins, fh=f.h*H-2*ins;
    if(fw<4||fh<4) continue;
    var ix=fx+bw, iy=fy+bw, iw=fw-2*bw, ih=fh-2*bw;
    cx.save(); cx.beginPath(); cx.rect(ix,iy,iw,ih); cx.clip();
    pn=(pg.paineis||[])[leaf.idx];
    if(pn&&pn.temDesenho){
      var img=await window.EditorDesenho.compor(pn.id,pn,1600,false);
      if(img){                                   /* preenche o quadro, cortando o excesso no centro */
        var sc=Math.max(iw/img.width,ih/img.height), dw=img.width*sc, dh=img.height*sc;
        cx.imageSmoothingQuality="high";
        cx.drawImage(img,ix+(iw-dw)/2,iy+(ih-dh)/2,dw,dh);
      }
    }
    var lst=lay.tracos[leaf.idx];
    if(lst&&lst.length){
      var rb=novoCanvas(Math.max(1,Math.round(iw)),Math.max(1,Math.round(ih))), rc=rb.getContext("2d");
      lst.forEach(function(t){ vDesenharTraco(rc,t,rb.width,rb.height,k); });
      cx.drawImage(rb,ix,iy,iw,ih);
    }
    cx.restore();
    cx.strokeStyle="#111"; cx.lineWidth=bw;
    cx.strokeRect(fx+bw/2,fy+bw/2,fw-bw,fh-bw);
  }
  return out;
}

function nomeSeguro(t){ return String(t).replace(/[^\wÀ-ÿ \-]/g,"").trim()||"roteiro"; }
function canvasBlob(cv,tipo,q){

/* PDF mínimo: uma imagem JPEG por folha (sem bibliotecas externas) */
function montarPDF(imgs,pw,ph){
  var enc=new TextEncoder(), partes=[], pos=0, offs=[], n=imgs.length, i;
  function put(x){ var b=typeof x==="string"?enc.encode(x):x; partes.push(b); pos+=b.length; }
  function obj(num,corpo){ offs[num]=pos; put(num+" 0 obj\n"); corpo(); put("\nendobj\n"); }
  put("%PDF-1.4\n");
  obj(1,function(){ put("<< /Type /Catalog /Pages 2 0 R >>"); });
  var kids=[]; for(i=0;i<n;i++) kids.push((3+3*i)+" 0 R");
  obj(2,function(){ put("<< /Type /Pages /Kids ["+kids.join(" ")+"] /Count "+n+" >>"); });
  imgs.forEach(function(im,j){
    var pg=3+3*j, ct=4+3*j, ig=5+3*j, cont="q "+pw+" 0 0 "+ph+" 0 0 cm /Im0 Do Q";
    obj(pg,function(){ put("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+pw+" "+ph+"] /Resources << /XObject << /Im0 "+ig+" 0 R >> >> /Contents "+ct+" 0 R >>"); });
    obj(ct,function(){ put("<< /Length "+cont.length+" >>\nstream\n"+cont+"\nendstream"); });
    obj(ig,function(){
      put("<< /Type /XObject /Subtype /Image /Width "+im.w+" /Height "+im.h+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+im.bytes.length+" >>\nstream\n");
      put(im.bytes); put("\nendstream");
    });
  });
  var total=3+3*n, xr=pos;
  put("xref\n0 "+total+"\n0000000000 65535 f \n");
  for(i=1;i<total;i++) put(("0000000000"+offs[i]).slice(-10)+" 00000 n \n");
  put("trailer\n<< /Size "+total+" /Root 1 0 R >>\nstartxref\n"+xr+"\n%%EOF\n");
  return new Blob(partes,{type:"application/pdf"});
}

async function exportarCapituloPDF(btn){
  if(!doc||!doc.paginas.length){ aviso("Este capítulo ainda não tem páginas."); return; }
  var rot=btn.textContent, W=1500, imgs=[], i;
  btn.disabled=true;
  try{
    for(i=0;i<doc.paginas.length;i++){
      btn.textContent="Gerando página "+(i+1)+" de "+doc.paginas.length+"…";
      var cv=await compPagina(doc.paginas[i],W), bl=await canvasBlob(cv,"image/jpeg",0.92);
      imgs.push({bytes:new Uint8Array(await bl.arrayBuffer()),w:cv.width,h:cv.height});
    }
    baixarArquivo(montarPDF(imgs,360,504),nomeSeguro(nomeObra()+" cap "+(doc.numero||1))+".pdf");
    aviso("PDF gerado ("+imgs.length+(imgs.length===1?" página":" páginas")+").");
  }catch(e){
    console.error("exportar PDF:",e); aviso("Não foi possível gerar o PDF.");
  }
  btn.textContent=rot; btn.disabled=false;
}
